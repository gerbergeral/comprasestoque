<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pedidos e Estoque · Gerber</title>
<style>
:root{
  --bg:#f3f4f6;--card:#fff;--ink:#1c2230;--mut:#6b7280;--line:#e5e7eb;
  --pri:#111111;--pri2:#000000;--pril:#e5e7eb;
  --am:#92400e;--amb:#fef3c7;--az:#1e40af;--azb:#dbeafe;--ro:#5b21b6;--rob:#ede9fe;--la:#9a3412;--lab:#ffedd5;
  --vc:#155e75;--vcb:#cffafe;--te:#0f766e;--teb:#ccfbf1;--vd:#065f46;--vdb:#d1fae5;--vm:#991b1b;--vmb:#fee2e2;--cz:#374151;--czb:#e5e7eb
}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.4}
header{background:#000;color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;position:sticky;top:0;z-index:20}
header h1{font-size:15px;margin:0;flex:1;font-weight:600;letter-spacing:.3px;min-width:160px;display:flex;align-items:center;gap:12px}
header h1 img{height:26px;width:auto;display:block}
header h1 span{opacity:.85;border-left:1px solid rgba(255,255,255,.3);padding-left:12px}
#login{overflow:hidden;padding:0}
#login .topo{background:#000;padding:26px 20px;display:flex;justify-content:center}
#login .topo img{height:48px;width:auto}
#login .topo b{color:#fff;font-size:22px;letter-spacing:1px}
#login .corpo{padding:16px}
@media(max-width:480px){header h1 img{height:20px}header h1 span{font-size:13px}}
header .chip{background:rgba(255,255,255,.12);padding:4px 10px;border-radius:99px;font-size:13px}
header button{background:transparent;border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:8px;padding:6px 10px;cursor:pointer;font-size:13px}
main{max-width:1150px;margin:0 auto;padding:16px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px;padding-bottom:2px}
.tabs button{border:1px solid var(--line);background:var(--card);padding:9px 14px;border-radius:10px;cursor:pointer;white-space:nowrap;font-size:14px;color:var(--ink)}
.tabs button.on{background:var(--pri);border-color:var(--pri);color:#fff}
.n{display:inline-block;min-width:20px;padding:0 6px;margin-left:6px;border-radius:99px;background:var(--vmb);color:var(--vm);font-size:12px;font-weight:700;text-align:center}
.tabs button.on .n{background:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.card h2{font-size:17px;margin:0 0 12px}
.card h3{font-size:15px;margin:0 0 10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.full{grid-column:1/-1}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mut);font-weight:600}
input,select,textarea{font:inherit;font-size:15px;color:var(--ink);border:1px solid #d1d5db;border-radius:9px;padding:9px 10px;background:#fff;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--pril);border-color:var(--pri)}
.btn{border:1px solid #d1d5db;background:#fff;color:var(--ink);border-radius:9px;padding:8px 12px;cursor:pointer;font-size:14px;font-weight:600;font-family:inherit}
.btn:hover{background:#f9fafb}
.btn.prim{background:var(--pri);border-color:var(--pri);color:#fff;padding:11px 14px}
.btn.prim:hover{background:var(--pri2)}
.btn.ok{background:var(--vdb);border-color:#a7f3d0;color:var(--vd)}
.btn.no{background:var(--vmb);border-color:#fecaca;color:var(--vm)}
.btn.sm{padding:5px 9px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.hid{display:none!important}
.muted{color:var(--mut)}
.peq{font-size:13px}
.filtros{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.filtros select,.filtros input{width:auto;min-width:140px;flex:1}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chips button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 12px;cursor:pointer;font-size:13px;font-family:inherit;color:var(--ink)}
.chips button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chips button b{font-weight:700}
.ped{border:1px solid var(--line);border-left:4px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;background:#fff;cursor:pointer}
.ped:hover{box-shadow:0 2px 10px rgba(0,0,0,.06)}
.ped.urg{border-left-color:#dc2626}
.ped.atr{background:#fff7f7}
.ped-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:4px}
.ped-desc{font-weight:600;margin-bottom:6px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.meta{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px;color:var(--mut)}
.pill{font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;white-space:nowrap}
.s-pendente{background:var(--amb);color:var(--am)}
.s-visto{background:var(--azb);color:var(--az)}
.s-aguardando-orcamento{background:var(--lab);color:var(--la)}
.s-em-compra{background:var(--rob);color:var(--ro)}
.s-em-separacao{background:var(--vcb);color:var(--vc)}
.s-separado{background:var(--teb);color:var(--te)}
.s-pendencia-na-entrega{background:var(--vmb);color:var(--vm)}
.s-entregue{background:var(--vdb);color:var(--vd)}
.s-cancelado{background:var(--czb);color:var(--cz)}
.tag{font-size:11.5px;font-weight:700;padding:2px 7px;border-radius:99px;background:var(--vmb);color:var(--vm);white-space:nowrap}
.tag.cinza{background:var(--czb);color:var(--cz)}
.atrasado{color:var(--vm);font-weight:700}
.hoje{color:var(--am);font-weight:700}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.kpi b{display:block;font-size:26px;line-height:1.1}
.kpi span{font-size:12.5px;color:var(--mut);font-weight:600}
.kpi.alerta b{color:var(--vm)}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.3px;background:#f9fafb;white-space:nowrap}
td.num,th.num{text-align:right;white-space:nowrap}
tr.baixo td{background:#fff7ed}
.vazio{color:var(--mut);text-align:center;padding:24px}
/* login */
#login{max-width:380px;margin:40px auto}
/* novo pedido */
.tipos{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tipo{border:2px solid var(--line);border-radius:14px;background:#fff;padding:20px 16px;text-align:left;cursor:pointer;font-family:inherit;color:var(--ink)}
.tipo:hover{border-color:var(--pri)}
.tipo .ic{font-size:30px;display:block;margin-bottom:8px}
.tipo b{font-size:16px;display:block;margin-bottom:4px}
.tipo span{font-size:13px;color:var(--mut)}
.voltar{background:none;border:0;color:var(--pri);font-weight:600;cursor:pointer;padding:0;font-size:14px;font-family:inherit;margin-bottom:10px}
.resultados{border:1px solid var(--line);border-radius:10px;max-height:330px;overflow:auto;margin-top:8px}
.res{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 10px;border-bottom:1px solid var(--line)}
.res:last-child{border-bottom:0}
.res .cat{font-size:12px;color:var(--mut)}
.res button{flex:none}
.livre{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:#f9fafb;border:1px dashed #cbd5e1;border-radius:10px;padding:10px;margin-top:8px;font-size:14px}
.guia{font-size:13px;color:var(--mut);margin-top:6px}
.carr{border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px;display:grid;grid-template-columns:1fr 90px 34px;gap:8px;align-items:center}
.carr .nome{font-weight:600;font-size:14px}
.carr .nome small{display:block;color:var(--mut);font-weight:500}
.carr input{padding:7px 8px}
.carr .obs{grid-column:1/-1}
.rm{border:0;background:var(--vmb);color:var(--vm);border-radius:8px;width:34px;height:34px;cursor:pointer;font-size:18px}
.prios{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.prio{border:2px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;display:flex;gap:8px;align-items:flex-start;color:var(--ink);font-weight:600;font-size:14px;flex-direction:row}
.prio input{width:auto;margin-top:3px}
.prio small{display:block;color:var(--mut);font-weight:500}
.prio.on{border-color:var(--pri);background:#f5f5f5}
.prio.on.urgente{border-color:#dc2626;background:#fef2f2}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.thumbs .t{position:relative;width:86px;height:86px;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:#f3f4f6}
.thumbs img{width:100%;height:100%;object-fit:cover;display:block}
.thumbs .t button{position:absolute;top:3px;right:3px;border:0;border-radius:99px;width:22px;height:22px;background:rgba(0,0,0,.6);color:#fff;cursor:pointer;line-height:1}
.fotoBtn{display:inline-flex;align-items:center;gap:6px;border:1px dashed #94a3b8;border-radius:10px;padding:10px 12px;cursor:pointer;color:var(--ink);font-weight:600;font-size:14px;flex-direction:row}
.fotoBtn input{display:none}
/* linha do tempo */
.tl{display:flex;align-items:flex-start;margin:10px 0 4px}
.tl .p{flex:1;text-align:center;font-size:11.5px;color:var(--mut);position:relative}
.tl .p:before{content:"";position:absolute;top:7px;left:-50%;width:100%;height:3px;background:var(--line);z-index:0}
.tl .p:first-child:before{display:none}
.tl .p i{display:block;width:16px;height:16px;border-radius:99px;background:#fff;border:3px solid var(--line);margin:0 auto 4px;position:relative;z-index:1}
.tl .p.f i{background:var(--pri);border-color:var(--pri)}
.tl .p.f:before{background:var(--pri)}
.tl .p.a{color:var(--ink);font-weight:700}
.tl .p.a i{border-color:var(--pri);background:#fff;box-shadow:0 0 0 4px var(--pril)}
/* detalhe */
.ov{position:fixed;inset:0;background:rgba(17,24,39,.45);display:none;align-items:flex-end;justify-content:center;z-index:40;padding:12px}
.ov .caixa{background:#fff;border-radius:16px;padding:18px;width:100%;max-width:470px;max-height:92vh;overflow:auto;position:relative}
.ov .caixa.larga{max-width:760px}
#modal{z-index:45}
.fechar{position:absolute;top:10px;right:10px;border:0;background:#f3f4f6;border-radius:99px;width:32px;height:32px;font-size:18px;cursor:pointer}
.info{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px 14px;font-size:14px;margin:12px 0}
.info div span{display:block;font-size:12px;color:var(--mut);font-weight:600}
.hist{list-style:none;margin:0;padding:0;font-size:13px}
.hist li{padding:7px 0;border-bottom:1px solid var(--line)}
.hist li b{font-weight:600}
.acoes{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.secao{font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:var(--mut);font-weight:700;margin:16px 0 6px}
.caixaTxt{background:#f9fafb;border-radius:10px;padding:10px;font-size:14px;white-space:pre-wrap}
#modal h3{margin:0 0 4px;font-size:17px;padding-right:30px}
#modal .sub{font-size:13px;color:var(--mut);margin-bottom:12px}
#modal form{display:flex;flex-direction:column;gap:10px}
#modal .bts{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}
.sug{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.sug button{border:1px solid var(--line);background:#f9fafb;border-radius:99px;padding:5px 11px;font-size:13px;cursor:pointer;font-family:inherit;color:var(--ink);font-weight:600}
.sug button:hover{border-color:var(--pri)}
.inf{font-size:13px;background:#f9fafb;border-radius:8px;padding:8px 10px;color:var(--ink)}
#toast{pointer-events:none;position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 16px;border-radius:10px;font-size:14px;z-index:60;max-width:92vw;display:none;box-shadow:0 6px 24px rgba(0,0,0,.25)}
#toast.erro{background:#b91c1c}
#carga{position:fixed;inset:0;background:rgba(255,255,255,.55);display:none;align-items:center;justify-content:center;z-index:55}
#carga{flex-direction:column;gap:10px}
#carga p{margin:0;font-weight:600;color:var(--ink);background:#fff;padding:4px 12px;border-radius:99px}
#carga div{width:38px;height:38px;border:4px solid #d1d5db;border-top-color:#000;border-radius:50%;animation:g .8s linear infinite}
@keyframes g{to{transform:rotate(360deg)}}
/* status em trânsito */
.s-em-transito{background:#111;color:#fff}
/* linha do tempo: ícones animados */
.tl .p.a i.em{width:auto;height:auto;border:0;background:none;box-shadow:none;font-size:18px;line-height:16px;margin-top:-2px;animation:pula 1.1s ease-in-out infinite}
@keyframes pula{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
/* BYD */
.byd{background:linear-gradient(#f8fafc,#eef2f7);border:1px solid var(--line);border-radius:12px;padding:8px 10px 6px;margin-top:10px;overflow:hidden}
.byd svg{display:block;width:100%;max-width:360px;height:auto;margin:0 auto}
.byd .carro{animation:balanca .5s ease-in-out infinite}
.byd .roda{transform-box:fill-box;transform-origin:center;animation:gira .5s linear infinite}
.byd .estrada{animation:estrada .45s linear infinite}
.byd .vento{animation:vento .7s linear infinite}
.byd .balao{animation:balao 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:30% 100%}
@keyframes balao{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.byd p{margin:4px 0 0;text-align:center;font-size:13px;font-weight:600}
@keyframes gira{to{transform:rotate(360deg)}}
@keyframes balanca{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.2px)}}
@keyframes estrada{to{stroke-dashoffset:24}}
@keyframes vento{0%{transform:translateX(20px);opacity:0}30%{opacity:.8}100%{transform:translateX(-30px);opacity:0}}
.byd .cena{position:relative;max-width:340px;margin:0 auto;padding:44px 0 10px}
.byd .carro2{position:relative;animation:dirige 1.8s ease-in-out infinite;z-index:1}
.byd .carro2 .car{width:100%;display:block}
.byd .carro2 .cab{position:absolute;left:21%;top:-19%;width:17%;transform-origin:50% 95%;animation:cabeca 1.6s ease-in-out infinite;filter:drop-shadow(0 3px 3px rgba(0,0,0,.35))}
.byd .carro2 .mao{position:absolute;left:9%;top:-20%;font-size:30px;transform-origin:70% 95%;animation:acena .38s ease-in-out infinite alternate}
.byd .carro2 .balao2{position:absolute;left:40%;top:-24%;background:#fff;border:1.5px solid #111;border-radius:12px;padding:3px 10px;font-size:12px;font-weight:700;white-space:nowrap;animation:balao 1.2s ease-in-out infinite;min-width:118px;text-align:center}
.byd .carro2 .balao2 b{font-weight:700;position:absolute;left:0;right:0;top:3px;opacity:0;animation:fala 7.5s infinite}
.byd .carro2 .balao2 b:nth-child(1){position:static;animation-delay:0s}
.byd .carro2 .balao2 b:nth-child(2){animation-delay:2.5s}
.byd .carro2 .balao2 b:nth-child(3){animation-delay:5s}
.byd .carro2 .balao2:after{content:"";position:absolute;left:10px;bottom:-7px;width:10px;height:10px;background:#fff;border-right:1.5px solid #111;border-bottom:1.5px solid #111;transform:rotate(45deg)}
.byd .estrada2{position:absolute;left:0;right:0;bottom:12px;height:3px;background:repeating-linear-gradient(90deg,#9ca3af 0 14px,transparent 14px 24px);animation:estrada2 .4s linear infinite}
.byd .vento2{position:absolute;left:0;top:50%;width:40px;height:40px}
.byd .vento2 i{position:absolute;left:0;height:2px;width:16px;background:#94a3b8;border-radius:2px;animation:vento .7s linear infinite}
.byd .vento2 i:nth-child(1){top:0}.byd .vento2 i:nth-child(2){top:12px;animation-delay:.2s}.byd .vento2 i:nth-child(3){top:24px;animation-delay:.4s}
@keyframes estrada2{to{background-position:-24px 0}}
@keyframes cabeca{0%{transform:translateY(5px) rotate(-12deg)}12%{transform:translateY(-10px) rotate(10deg) scale(1.08)}24%{transform:translateY(0) rotate(-8deg)}36%{transform:translateY(-14px) rotate(14deg) scale(1.12)}48%{transform:translateY(3px) rotate(-14deg)}60%{transform:translateY(-8px) rotate(8deg) scale(1.05)}72%{transform:translateY(2px) rotate(-6deg)}86%{transform:translateY(-12px) rotate(12deg) scale(1.1)}100%{transform:translateY(5px) rotate(-12deg)}}
@keyframes dirige{0%{transform:translate(-8px,0) rotate(0)}20%{transform:translate(-2px,-3px) rotate(-.6deg)}40%{transform:translate(8px,0) rotate(0)}60%{transform:translate(4px,-2px) rotate(.5deg)}80%{transform:translate(-4px,-3px) rotate(-.4deg)}100%{transform:translate(-8px,0) rotate(0)}}
@keyframes fala{0%{opacity:0;transform:translateY(4px)}4%,30%{opacity:1;transform:none}34%,100%{opacity:0}}
@keyframes acena{from{transform:rotate(-30deg) translateY(2px)}to{transform:rotate(40deg) translateY(-4px)}}
@keyframes balao{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
/* boas-vindas, frases e datas */
.hero{background:#000;color:#fff;border-radius:14px;padding:16px;margin-bottom:14px;position:relative;overflow:hidden}
.hero .saud{font-size:18px;font-weight:700}
.hero .frase{margin-top:8px;font-size:15px;line-height:1.45;opacity:.92}
.hero .frase small{display:block;margin-top:6px;font-size:12px;opacity:.6;letter-spacing:.4px;text-transform:uppercase}
.hero:after{content:"";position:absolute;right:-40px;top:-40px;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.06)}
.datas{display:grid;gap:8px}
.data{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff}
.data .em{font-size:26px;flex:none}
.data .tx{flex:1;min-width:0}
.data .tx b{display:block}
.data .tx span{font-size:13px;color:var(--mut)}
.data .falta{font-size:12px;font-weight:700;background:var(--amb);color:var(--am);border-radius:99px;padding:3px 9px;white-space:nowrap}
.data .falta.hoje{background:var(--vmb);color:var(--vm)}
.chipsDatas{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chipsDatas span{background:rgba(255,255,255,.12);border-radius:99px;padding:4px 10px;font-size:12.5px}
/* alertas */
.tag.lar{background:var(--lab);color:var(--la)}
.alertaBox{background:#fff7ed;border:1px solid #fed7aa;border-radius:12px;padding:10px 12px;margin:12px 0}
.alertaBox b{color:var(--la)}
.alertaBox ul{margin:6px 0 0;padding-left:18px;font-size:13.5px}
.alertaBox li{margin:3px 0}
.al{display:flex;gap:12px;border:1px solid var(--line);border-left:4px solid #f59e0b;border-radius:12px;padding:12px;margin-bottom:10px;background:#fff}
.al.alto{border-left-color:#dc2626}
.al.info{border-left-color:#3b82f6}
.al .ic{font-size:22px;flex:none}
.al .tx{flex:1}
.al .tx b{display:block}
.al .tx div{font-size:13.5px;color:var(--ink);margin-top:2px}
.al .tx small{color:var(--mut)}
.avisoRep{grid-column:1/-1;font-size:12.5px;background:var(--amb);color:var(--am);border-radius:8px;padding:6px 8px}
/* comemoração */
#festa{position:fixed;inset:0;z-index:70;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.55);padding:20px}
#festa .box{background:#fff;border-radius:20px;padding:28px 22px;text-align:center;max-width:360px;width:100%;animation:entra .45s cubic-bezier(.2,1.4,.4,1)}
#festa svg{width:110px;height:110px}
#festa .circ{stroke-dasharray:300;stroke-dashoffset:300;animation:traca .6s ease-out forwards}
#festa .chk{stroke-dasharray:80;stroke-dashoffset:80;animation:traca .4s .5s ease-out forwards}
#festa h2{font-size:28px;margin:10px 0 4px}
#festa p{margin:6px 0;color:var(--mut)}
#festa .grat{color:var(--ink);font-weight:600}
#confete{position:fixed;inset:0;pointer-events:none;z-index:71}
@keyframes traca{to{stroke-dashoffset:0}}
@keyframes entra{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
@media(min-width:700px){.ov{align-items:center}}

// ---------- utilidades
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => { const n = parseFloat(String(v == null ? '' : v).replace(',', '.')); return isNaN(n) ? 0 : n; };
const N = v => num(v).toLocaleString('pt-BR', {maximumFractionDigits:2});
const R = v => num(v).toLocaleString('pt-BR', {style:'currency', currency:'BRL'});
const dataBR = s => { if (!s) return ''; const p = String(s).slice(0,10).split('-'); return p.length === 3 ? p[2]+'/'+p[1]+'/'+p[0] : String(s); };
const horaBR = s => s && String(s).length > 15 ? String(s).slice(11,16) : '';
const dataHora = s => s ? dataBR(s) + (horaBR(s) ? ' ' + horaBR(s) : '') : '';
const semAcento = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
const slug = s => semAcento(s).replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
const hojeISO = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0,10); };
const diaZero = s => { const d = new Date(s); d.setHours(0,0,0,0); return d; };
const mesDe = s => String(s || '').slice(0,7);
const nomeMes = m => { if (!m) return ''; const [a, mm] = m.split('-'); return ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'][+mm-1] + '/' + a; };
const gestao = () => S.perfil === 'gestao';
const ativo = c => ATIVOS.includes(c.status);
let _uid = 0;

function rotulo(st, tipo){
  if (tipo === 'Reparo') {
    if (st === 'Em separação') return 'Em execução';
    if (st === 'Separado') return 'Serviço concluído';
    if (st === 'Entregue') return 'Finalizado';
    if (st === 'Em trânsito') return 'Equipe a caminho';
  }
  if (st === 'Separado') return 'Separado p/ entrega';
  if (st === 'Em trânsito') return 'Em trânsito 🚗';
  return st;
}
const sugestoes = (alvo, ops) => ops.length ? `<div class="sug">${ops.slice(0, 12).map(o => `<button type="button" data-sug="${esc(alvo)}" data-v="${esc(o)}">${esc(o)}</button>`).join('')}</div>` : '';
const pill = c => `<span class="pill s-${slug(c.status)}">${esc(rotulo(c.status, c.tipo))}</span>`;

function prazoInfo(c){
  if (!c.prazo) return {txt:'', cls:'', atrasado:false};
  if (c.status === 'Entregue') {
    const dr = c.confirmado_em || c.data_recebimento;
    const noPrazo = dr && diaZero(dr) <= diaZero(c.prazo);
    return {txt: noPrazo ? 'Entregue no prazo' : 'Entregue fora do prazo', cls: noPrazo ? '' : 'atrasado', atrasado:false};
  }
  if (!ativo(c)) return {txt:'', cls:'', atrasado:false};
  if (c.status === 'Separado') return {txt: c.tipo === 'Reparo' ? 'Aguardando confirmação da filial' : 'Pronto — aguardando saída', cls:'', atrasado:false};
  if (c.status === 'Em trânsito') return {txt:'A caminho' + (c.entregador ? ' com ' + c.entregador : ''), cls:'', atrasado:false};
  const dias = Math.round((diaZero(c.prazo) - diaZero(new Date())) / 864e5);
  if (dias < 0) return {txt:`Atrasado ${-dias} dia${dias === -1 ? '' : 's'}`, cls:'atrasado', atrasado:true};
  if (dias === 0) return {txt:'Vence hoje', cls:'hoje', atrasado:false};
  return {txt:`Prazo ${dataBR(c.prazo)} (${dias} dia${dias === 1 ? '' : 's'})`, cls:'', atrasado:false};
}

function timeline(c){
  if (c.status === 'Cancelado') return `<div class="inf" style="background:var(--czb)">Cancelado em ${dataHora(c.cancelado_em)} por <b>${esc(c.cancelado_por)}</b> — ${esc(c.motivo_cancelamento)}</div>`;
  const rep = c.tipo === 'Reparo';
  const passos = rep ? ['Pendente','Visto','Em execução','Concluído','Finalizado'] : ['Pendente','Visto','Em separação / compra','Separado','Em trânsito','Entregue'];
  const mapa = rep ? {'Pendente':0,'Visto':1,'Aguardando orçamento':2,'Em compra':2,'Em separação':2,'Em trânsito':2,'Pendência na entrega':2,'Separado':3,'Entregue':4}
                   : {'Pendente':0,'Visto':1,'Aguardando orçamento':2,'Em compra':2,'Em separação':2,'Pendência na entrega':2,'Separado':3,'Em trânsito':4,'Entregue':5};
  const idx = mapa[c.status] ?? 0, fim = c.status === 'Entregue';
  const icone = {'Em separação':'📦','Em compra':'🛒','Aguardando orçamento':'🧾','Em trânsito':'🚗','Pendência na entrega':'⚠️','Pendente':'⏳'}[c.status];
  return `<div class="tl">${passos.map((p, i) => { const at = i === idx && !fim; return `<div class="p ${i < idx || fim ? 'f' : ''} ${at ? 'a' : ''}">${at && icone ? `<i class="em">${icone}</i>` : '<i></i>'}${esc(at && i === 2 ? rotulo(c.status, c.tipo) : p)}</div>`; }).join('')}</div>`;
}

function toast(msg, erro){ const t = $('#toast'); t.textContent = msg; t.className = erro ? 'erro' : ''; t.style.display = 'block'; clearTimeout(t._t); t._t = setTimeout(() => t.style.display = 'none', erro ? 7000 : 3500); }
function carga(on){ $('#carga').style.display = on ? 'flex' : 'none'; }
function lembrarNome(n){ if (!n) return; S.nome = n; try { localStorage.setItem('gerberNome_' + S.unidade, n); } catch (e) {} }

async function chamar(acao, p, silencioso){
  if (!silencioso) { if (acao === 'login' || acao === 'dados') $('#carga p').textContent = 'Carregando…'; carga(true); }
  try {
    const corpo = {acao, perfil:S.perfil, unidade:S.unidade, senha:S.senha};
    if (p) corpo.p = p;
    const r = await fetch(API, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify(corpo)});
    const j = await r.json();
    if (!j.ok) throw new Error(j.erro || 'Erro desconhecido');
    if (j.chamados) guardar('gerberDados2', j);
    return j;
  } catch (e) {
    if (e instanceof TypeError || e instanceof SyntaxError) throw new Error('Erro ao conectar. Confira a internet e tente de novo.');
    throw e;
  } finally { if (!silencioso) carga(false); }
}

async function executar(acao, p, depois){
  try {
    $('#carga p').textContent = acao === 'abrirChamado' ? 'Enviando pedido…' : 'Salvando…';
    const j = await chamar(acao, p);
    S.d = j; fecharModal();
    if (depois) depois();
    render(); if (S.detId) renderDetalhe();
    if (j.msg) toast(j.msg);
    return true;
  } catch (e) { toast(e.message, true); return false; }
}

// ---------- fotos (reduz no celular antes de enviar)
async function reduzir(file){
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((ok, erro) => { const i = new Image(); i.onload = () => ok(i); i.onerror = erro; i.src = url; });
    const max = 1280, k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const cv = document.createElement('canvas');
    cv.width = Math.round(img.naturalWidth * k); cv.height = Math.round(img.naturalHeight * k);
    cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
    return cv.toDataURL('image/jpeg', 0.75);
  } finally { URL.revokeObjectURL(url); }
}
async function lerFotos(files, limite){
  const out = [];
  for (const f of Array.from(files || []).slice(0, limite)) {
    if (!/^image\//.test(f.type)) continue;
    try { out.push(await reduzir(f)); } catch (e) { toast('Não consegui ler uma das fotos.', true); }
  }
  return out;
}

async function iniciar(){
  let lista = null;
  try { lista = JSON.parse(localStorage.getItem('gerberUnidades') || 'null'); } catch (e) {}
  preencherAcessos(lista || UNIDADES_PADRAO);
  // sessão aberta: mostra na hora o que já estava na tela e atualiza por trás
  const s = lerGuardado('gerberPedidos2'), dc = lerGuardado('gerberDados2');
  if (s && dc) {
    Object.assign(S, s); S.d = dc; mostrarApp();
    chamar('dados', null, true).then(j => { S.d = j; if (!(S.aba === 'novo' && S.novo.tipo)) render(); if (S.detId) renderDetalhe(); })
      .catch(e => { if (/senha/i.test(e.message)) { guardar('gerberPedidos2', null); guardar('gerberDados2', null); location.reload(); } });
  } else if (s) {
    Object.assign(S, s); if (await entrar(true)) return;
  }
  // acorda o servidor e confirma a lista de filiais
  chamar('inicio', null, true).then(j => {
    preencherAcessos(j.unidades);
    try { localStorage.setItem('gerberUnidades', JSON.stringify(j.unidades)); } catch (e) {}
  }).catch(e => { if (!lista) $('#lgErro').textContent = e.message; });
}

async function entrar(silencioso){
  try {
    const j = await chamar('login', null, silencioso);
    S.d = j; S.aba = '';
    guardar('gerberPedidos2', {perfil:S.perfil, unidade:S.unidade, senha:S.senha});
    mostrarApp();
    return true;
  } catch (e) {
    if (!silencioso) $('#lgErro').textContent = e.message;
    guardar('gerberPedidos2', null); guardar('gerberDados2', null);
    return false;
  }
}

function buscarCatalogo(q, cat){
  const toks = semAcento(q).split(/\s+/).filter(Boolean);
  const exemplos = {}; S.d.categorias.forEach(c => exemplos[c.nome] = c.exemplos);
  let lista = S.d.catalogo.filter(i => !cat || i.departamento === cat);
  if (toks.length) {
    lista = lista.map(i => {
      const nome = semAcento(i.item), hay = nome + ' ' + semAcento(i.departamento + ' ' + i.sinonimos + ' ' + (exemplos[i.departamento] || ''));
      if (!toks.every(t => hay.includes(t))) return null;
      const score = (nome.startsWith(toks[0]) ? 0 : 1) + (toks.every(t => nome.includes(t)) ? 0 : 2);
      return {i, score};
    }).filter(Boolean).sort((a, b) => a.score - b.score || a.i.item.localeCompare(b.i.item)).map(x => x.i);
  } else {
    lista = lista.slice().sort((a, b) => a.item.localeCompare(b.item));
  }
  return lista;
}

function adicionarItem(id){
  const n = S.novo, it = S.d.catalogo.find(i => i.id === String(id)); if (!it) return;
  const l = n.carrinho.find(x => x.item_id === it.id);

  else n.carrinho.push({item_id:it.id, item:it.item, departamento:it.departamento, unidade_medida:it.unidade_medida, quantidade:1, obs:''});

async function enviarNovo(){
  const n = S.novo;
  const nome = $('#nvNome').value.trim();
  if (!nome) { toast('Informe quem está pedindo.', true); $('#nvNome').focus(); return; }
  const p = {tipo:n.tipo, prioridade:n.prioridade, solicitante:nome, fotos:n.fotos};
  if (n.tipo === 'Reparo') {
    Object.assign(p, {categoria:$('#nvCat').value, local:$('#nvLocal').value, descricao:$('#nvDesc').value});
  } else {
    const itens = n.carrinho.filter(l => num(l.quantidade) > 0);
    if (!itens.length) { toast('Adicione pelo menos um item com quantidade.', true); return; }
    p.itens = itens; p.descricao = ($('#nvObs') || {}).value || '';
  }
  lembrarNome(nome);
  await executar('abrirChamado', p, () => {
    S.novo = {tipo:'', carrinho:[], busca:'', cat:'', fotos:[], prioridade:'Normal', obs:''};
    S.aba = 'meus'; F.meus = 'andamento';
  });
}

const GRUPOS = {
  abertos:['Em aberto', c => ativo(c)],
  'Pendente':['Pendentes (não vistos)', c => c.status === 'Pendente'],
  'Visto':['Vistos, sem ação', c => c.status === 'Visto'],
  'Aguardando orçamento':['Aguardando orçamento', c => c.status === 'Aguardando orçamento'],
  'Em compra':['Em compra', c => c.status === 'Em compra'],
  'Em separação':['Em separação / execução', c => c.status === 'Em separação'],
  'Separado':['Separados (aguardando saída)', c => c.status === 'Separado'],
  'Em trânsito':['Em trânsito 🚗', c => c.status === 'Em trânsito'],
  'Pendência na entrega':['Pendência na entrega', c => c.status === 'Pendência na entrega'],
  atrasados:['Atrasados', c => prazoInfo(c).atrasado],
  'Entregue':['Entregues', c => c.status === 'Entregue'],
  'Cancelado':['Cancelados', c => c.status === 'Cancelado'],
  todos:['Todos', () => true]
};

function viewFila(){
  const d = S.d, b = semAcento(F.busca);
  const topo = topoGestao();
  const lista = d.chamados.filter(GRUPOS[F.grupo][1])
    .filter(c => !F.unidade || c.unidade === F.unidade)
    .filter(c => !F.prio || c.prioridade === F.prio)
    .filter(c => !b || semAcento([c.id, c.resumo, c.solicitante, c.local, c.descricao, c.categoria].join(' ')).includes(b));
  if (!['Entregue','Cancelado','todos'].includes(F.grupo)) {
    lista.sort((x, y) => (prazoInfo(y).atrasado - prazoInfo(x).atrasado) || ((y.prioridade === 'Urgente') - (x.prioridade === 'Urgente')) || (x.aberto_em < y.aberto_em ? -1 : 1));
  }
  const cont = k => d.chamados.filter(GRUPOS[k][1]).filter(c => !F.unidade || c.unidade === F.unidade).length;
  return topo + `<div class="chips" data-ctx="fila">${Object.keys(GRUPOS).map(k => { const n = cont(k); return (n || ['abertos','todos','Pendente'].includes(k) || F.grupo === k) ? `<button data-g="${esc(k)}" class="${F.grupo === k ? 'on' : ''}">${GRUPOS[k][0]} (<b>${n}</b>)</button>` : ''; }).join('')}</div>
  <div class="filtros">
    <select id="fUn"><option value="">Todas as filiais</option>${d.unidades.map(u => `<option ${F.unidade === u ? 'selected' : ''}>${esc(u)}</option>`).join('')}</select>

    <input id="fBusca" placeholder="Buscar nº, item, local, nome…" value="${esc(F.busca)}">
  </div>
  ${lista.length ? lista.map(cardChamado).join('') : '<div class="card vazio">Nenhum chamado com esses filtros.</div>'}`;
}

function viewGeral(){
  const d = S.d, C = d.chamados;
  const c = st => C.filter(x => x.status === st).length;
  const abertos = C.filter(ativo);
  const atrasados = abertos.filter(x => prazoInfo(x).atrasado);
  const baixos = d.itens.filter(i => i.ativo !== 'não' && String(i.estoque_minimo) !== '' && num(i.estoque_minimo) > 0 && num(i.estoque_atual) <= num(i.estoque_minimo));
  const kp = (n, t, al, g) => `<div class="kpi ${al && n ? 'alerta' : ''}" ${g ? `data-ir="${esc(g)}" style="cursor:pointer"` : ''}><b>${n}</b><span>${t}</span></div>`;
  const cols = ['Pendente','Visto','Aguardando orçamento','Em compra','Em separação','Separado','Em trânsito','Pendência na entrega'];
  const desde = Date.now() - 90 * 864e5;
  const fechados = C.filter(x => x.status === 'Entregue' && x.confirmado_em && new Date(x.confirmado_em).getTime() >= desde);
  const tempo = u => {
    const l = fechados.filter(x => x.unidade === u); if (!l.length) return ['–','–',0];
    const med = l.reduce((s, x) => s + (new Date(x.confirmado_em) - new Date(x.aberto_em)) / 864e5, 0) / l.length;
    const np = l.filter(x => diaZero(x.confirmado_em) <= diaZero(x.prazo)).length;
    return [N(Math.round(med * 10) / 10) + ' d', Math.round(np / l.length * 100) + '%', l.length];
  };
  return `<div class="kpis">
    ${kp(c('Pendente'), 'Pendentes — ninguém viu ainda', true, 'Pendente')}
    ${kp(c('Visto'), 'Vistos, sem ação', true, 'Visto')}
    ${kp(c('Aguardando orçamento'), 'Aguardando orçamento', false, 'Aguardando orçamento')}
    ${kp(c('Em compra'), 'Em compra', false, 'Em compra')}
    ${kp(c('Em separação'), 'Em separação / execução', false, 'Em separação')}
    ${kp(c('Separado'), 'Separados, aguardando saída', false, 'Separado')}
    ${kp(c('Em trânsito'), 'Em trânsito no BYD 🚗', false, 'Em trânsito')}
    ${kp(c('Pendência na entrega'), 'Pendência na entrega', true, 'Pendência na entrega')}
    ${kp(atrasados.length, 'Atrasados (passou o prazo)', true, 'atrasados')}
    ${kp(abertos.filter(x => x.prioridade === 'Urgente').length, 'Urgentes em aberto', true, 'abertos')}
    ${kp(baixos.length, 'Itens no estoque mínimo', true)}
  </div>
  <div class="card"><h3>Chamados em aberto por filial</h3><div class="tw"><table>
    <thead><tr><th>Filial</th>${cols.map(s => `<th class="num">${esc(s)}</th>`).join('')}<th class="num">Total</th></tr></thead>
    <tbody>${d.unidades.map(u => { const lu = abertos.filter(x => x.unidade === u); return `<tr><td><b>${esc(u)}</b></td>${cols.map(s => { const n = lu.filter(x => x.status === s).length; return `<td class="num">${n || '<span class="muted">–</span>'}</td>`; }).join('')}<td class="num"><b>${lu.length}</b></td></tr>`; }).join('')}</tbody>
  </table></div></div>
  <div class="card"><h3>Desempenho de atendimento (últimos 90 dias)</h3><div class="tw"><table>
    <thead><tr><th>Filial</th><th class="num">Chamados entregues</th><th class="num">Tempo médio (abertura → confirmação)</th><th class="num">Dentro do prazo</th></tr></thead>
    <tbody>${d.unidades.map(u => { const t = tempo(u); return `<tr><td><b>${esc(u)}</b></td><td class="num">${t[2]}</td><td class="num">${t[0]}</td><td class="num">${t[1]}</td></tr>`; }).join('')}</tbody>
  </table></div></div>
  <div class="card"><h3>Atrasados</h3>${atrasados.length ? atrasados.sort((a, b) => a.prazo < b.prazo ? -1 : 1).map(cardChamado).join('') : '<div class="vazio">Nenhum chamado atrasado. 👏</div>'}</div>
  <div class="card"><h3>Itens no estoque mínimo ou abaixo</h3>${baixos.length ? `<div class="tw"><table><thead><tr><th>Item</th><th>Categoria</th><th class="num">Saldo</th><th class="num">Mínimo</th></tr></thead><tbody>
    ${baixos.map(i => `<tr class="baixo"><td>${esc(i.item)}</td><td>${esc(i.departamento)}</td><td class="num">${N(i.estoque_atual)} ${esc(i.unidade_medida)}</td><td class="num">${N(i.estoque_minimo)}</td></tr>`).join('')}</tbody></table></div>`
    : '<div class="vazio">Nenhum item abaixo do mínimo. Defina o mínimo de cada item em Estoque › Editar.</div>'}</div>`;
}

function acoesDetalhe(c){
  const bt = (x, t, cls) => `<button class="btn sm ${cls || ''}" data-x="${esc(x)}">${t}</button>`;
  const at = ativo(c), rep = c.tipo === 'Reparo';
  let h = '';
  if (gestao()) {
    if (at) {
      if (c.status !== 'Em separação') h += bt('mv:Em separação', rep ? 'Em execução' : 'Em separação');
      if (c.status !== 'Em compra') h += bt('mv:Em compra', 'Em compra');
      if (c.status !== 'Aguardando orçamento') h += bt('mv:Aguardando orçamento', 'Aguardando orçamento');
      if (c.status !== 'Separado') h += bt('mv:Separado', rep ? 'Serviço concluído' : 'Separado p/ entrega', 'ok');
      h += bt('mv:Em trânsito', c.status === 'Em trânsito' ? '🚗 Atualizar entrega' : (rep ? '🚗 Equipe a caminho' : '🚗 Saiu no BYD'), 'ok');
      if (c.status === 'Aguardando orçamento' || c.orcamento_valor) {
        h += bt('orc:informar', c.orcamento_valor ? 'Novo valor de orçamento' : 'Informar orçamento');
        if (c.orcamento_valor && c.orcamento_status === 'Aguardando aprovação') h += bt('orc:aprovar', 'Aprovar orçamento', 'ok') + bt('orc:reprovar', 'Reprovar orçamento', 'no');
      }
    }
  } else if (CONFIRMAVEIS.includes(c.status)) {
    h += bt('confirmar', A_RECEBER.includes(c.status) ? '✓ Confirmar recebimento' : '✓ Já recebi', 'ok');
  }
  if (at) {
    h += bt('comentar', '💬 Comentar') + bt('foto', '📷 Adicionar foto');
    if (gestao() || ['Pendente','Visto'].includes(c.status)) h += bt('cancelar', 'Cancelar chamado', 'no');
  }
  return h;
}

// ---------- modal genérico
function abrirModal(tit, sub, campos, okTxt, onOk){
  $('#mdTit').textContent = tit; $('#mdSub').innerHTML = sub || '';
  const f = $('#mdForm');
  f.innerHTML = campos.map(c => {
    const req = c.req ? 'required' : '';
    if (c.tipo === 'info') return `<div class="inf">${c.html}</div>`;
    if (c.tipo === 'select') return `<label>${c.label}<select name="${c.k}" ${req}>${c.op.map(o => { const v = o.v != null ? o.v : o, t = o.t != null ? o.t : o; return `<option value="${esc(v)}" ${String(c.v) === String(v) ? 'selected' : ''}>${esc(t)}</option>`; }).join('')}</select></label>`;
    if (c.tipo === 'area') return `<label>${c.label}<textarea name="${c.k}" rows="3" ${req} placeholder="${esc(c.ph || '')}">${esc(c.v || '')}</textarea></label>`;
    if (c.tipo === 'lista') { const id = 'md' + (++_uid); return `<label>${c.label}<input id="${id}" name="${c.k}" value="${esc(c.v || '')}" ${req} placeholder="${esc(c.ph || '')}" autocomplete="off">${sugestoes(id, c.op || [])}</label>`; }
    if (c.tipo === 'fotos') return `<label class="fotoBtn">📷 Tirar ou escolher foto<input type="file" name="${c.k}" accept="image/*" multiple></label><div class="thumbs" data-prev="${c.k}"></div>`;
    return `<label>${c.label}<input name="${c.k}" type="${c.tipo || 'text'}" ${c.tipo === 'number' ? 'step="any" inputmode="decimal"' : ''} ${c.max ? `max="${c.max}"` : ''} value="${esc(c.v == null ? '' : c.v)}" ${req} placeholder="${esc(c.ph || '')}"></label>`;
  }).join('') + `<div class="bts"><button type="button" class="btn" data-fechar="modal">Voltar</button><button class="btn prim" type="submit">${okTxt}</button></div>`;
  const arq = {};
  f.querySelectorAll('input[type=file]').forEach(inp => inp.onchange = async () => {
    arq[inp.name] = (arq[inp.name] || []).concat(await lerFotos(inp.files, 3)).slice(0, 3); inp.value = '';
    f.querySelector(`[data-prev="${inp.name}"]`).innerHTML = arq[inp.name].map(x => `<div class="t"><img src="${x}"></div>`).join('');
  });
  $('#modal').style.display = 'flex';
  f.onsubmit = ev => { ev.preventDefault(); const v = {}; new FormData(f).forEach((val, k) => { if (typeof val === 'string') v[k] = val; }); Object.assign(v, arq); onOk(v); };
  const pri = f.querySelector('input:not([type=file]),select,textarea'); if (pri && window.innerWidth > 700) pri.focus();
}

// ---------- ações do detalhe
function acaoDetalhe(x){
  const c = S.d.chamados.find(y => y.id === S.detId); if (!c) return;
  const sub = `<b>${esc(c.id)}</b> · ${esc(c.unidade)} · ${esc(c.resumo)}`;
  const nomeCampo = {k:'nome', label:'Seu nome', tipo:'lista', op:S.d.usuario.nomes || [], v:S.nome, req:true};
  const comNome = arr => gestao() ? arr : [nomeCampo].concat(arr);
  const envia = (acao, extra) => v => { if (v.nome) lembrarNome(v.nome); executar(acao, Object.assign({id:c.id}, extra || {}, v)); };

  if (x === 'comentar') return abrirModal('Comentar', sub + '<br>O comentário fica no histórico e ' + (gestao() ? 'a filial vê.' : 'a gestão vê.'), comNome([{k:'texto', label:'Comentário', tipo:'area', req:true}]), 'Enviar', envia('comentar'));
  if (x === 'foto') return abrirModal('Adicionar foto', sub, comNome([{k:'fotos', tipo:'fotos'}, {k:'texto', label:'Legenda (opcional)'}]), 'Enviar foto', v => { if (!(v.fotos || []).length) return toast('Escolha uma foto.', true); envia('addFotos')(v); });
  if (x === 'cancelar') return abrirModal('Cancelar chamado', sub + '<br>O cancelamento fica registrado com data, hora e quem cancelou.', comNome([{k:'motivo', label:'Motivo do cancelamento', tipo:'area', req:true}]), 'Cancelar chamado', envia('cancelar'));
  if (x === 'confirmar') return abrirModal(c.tipo === 'Reparo' ? 'Confirmar serviço feito' : 'Confirmar recebimento', sub, [
    {k:'data_recebimento', label:'Data em que recebeu', tipo:'date', v:hojeISO(), max:hojeISO(), req:true},
    {k:'entregue_por', label:c.tipo === 'Reparo' ? 'Quem fez o serviço / entregou' : 'Quem entregou', tipo:'lista', op:c.entregador ? [c.entregador] : [], v:c.entregador || '', req:true},
    Object.assign({}, nomeCampo, {label:'Quem recebeu (você)'}),
    {k:'ok', label:'Chegou tudo certo?', tipo:'select', op:[{v:'sim', t:'Sim, tudo certo'}, {v:'nao', t:'Não — faltou algo, veio errado ou serviço incompleto'}], v:'sim'},
    {k:'obs', label:'Observação (obrigatória se teve problema)', tipo:'area'}
  ], 'Confirmar', async v => {
    if (v.nome) lembrarNome(v.nome);
    const ok = await executar('confirmarRecebimento', Object.assign({id:c.id}, v));
    if (ok && v.ok === 'sim') { fecharDet(); celebrar(c); }
  });

  const [tipo, alvo] = x.split(':');
  if (tipo === 'mv') {
    const campos = [];
    if (alvo === 'Aguardando orçamento') campos.push({k:'orcamento_valor', label:'Valor do orçamento (R$) — se já tiver', tipo:'number'}, {k:'orcamento_obs', label:'Fornecedor / detalhe do orçamento'});
    if (alvo === 'Separado' || alvo === 'Em trânsito') {
      const comItem = c.itens.filter(l => l.item_id !== '' && num(l.qtd_baixada) < num(l.quantidade));
      if (comItem.length) {
        campos.push({tipo:'info', html:'<b>Baixa no estoque</b> — confira quanto está saindo do almoxarifado (deixe 0 se veio de compra direta).'});
        comItem.forEach(l => {
          const it = S.d.itens.find(i => i.id === String(l.item_id));
          const s = it ? num(it.estoque_atual) : 0, falta = Math.max(0, num(l.quantidade) - num(l.qtd_baixada));
          campos.push({k:'baixa_' + l.linha, label:`${l.item} — pedido ${N(l.quantidade)}, saldo ${it && String(it.estoque_atual) !== '' ? N(s) : 'sem contagem'}`, tipo:'number', v:Math.min(falta, s)});
        });
      }
      const livres = c.itens.filter(l => l.item_id === '');
      if (livres.length) campos.push({tipo:'info', html:'Itens livres (sem baixa automática): ' + livres.map(l => esc(l.item)).join(', ')});
      if (alvo === 'Em trânsito') campos.unshift({tipo:'info', html:'🚗 <b>Saiu para entrega no BYD da Gerber.</b> A filial verá o carrinho a caminho e confirma quando chegar.'});
      campos.push({k:'entregador', label:c.tipo === 'Reparo' ? 'Quem vai fazer o serviço' : 'Quem está levando', v:c.entregador || '', tipo:'lista', op:['Charles','Roberta','Carol'], req:alvo === 'Em trânsito'});
    }
    campos.push({k:'obs', label:'Observação para a filial (opcional)', tipo:'area', ph:alvo === 'Em compra' ? 'Ex.: previsão de chegada dia 20' : ''});
    return abrirModal(rotulo(alvo, c.tipo), sub, campos, 'Salvar', v => {
      const p = {id:c.id, status:alvo, obs:v.obs, entregador:v.entregador, orcamento_valor:v.orcamento_valor, orcamento_obs:v.orcamento_obs, baixas:{}};
      Object.keys(v).forEach(k => { if (k.startsWith('baixa_')) p.baixas[k.slice(6)] = v[k]; });
      executar('mover', p);
    });
  }
  if (tipo === 'orc') {
    if (alvo === 'informar') return abrirModal('Orçamento', sub, [{k:'valor', label:'Valor (R$)', tipo:'number', v:c.orcamento_valor, req:true}, {k:'obs', label:'Fornecedor / detalhe'}], 'Salvar orçamento', envia('orcamento', {acao_orc:'informar'}));
    if (alvo === 'aprovar') return abrirModal('Aprovar orçamento', sub + `<br>Valor: <b>${R(c.orcamento_valor)}</b>`, [{k:'proximo', label:'Próximo passo', tipo:'select', op:[{v:'Em compra', t:'Em compra'}, {v:'Em separação', t:c.tipo === 'Reparo' ? 'Em execução' : 'Em separação'}], v:'Em compra'}, {k:'obs', label:'Observação (opcional)', tipo:'area'}], 'Aprovar', envia('orcamento', {acao_orc:'aprovar'}));
    if (alvo === 'reprovar') return abrirModal('Reprovar orçamento', sub + `<br>Valor: <b>${R(c.orcamento_valor)}</b>. O chamado continua aguardando um novo orçamento.`, [{k:'obs', label:'Motivo', tipo:'area', req:true}], 'Reprovar', envia('orcamento', {acao_orc:'reprovar'}));
  }

  if (e === 'entrada') abrirModal('Entrada no estoque', sub, [
    {k:'quantidade', label:'Quantidade que entrou', tipo:'number', req:true},
    {k:'custo_unitario', label:'Custo unitário (R$) — opcional', tipo:'number'},
    {k:'obs', label:'Fornecedor / nota / observação', tipo:'area'}
  ], 'Registrar entrada', v => executar('entradaEstoque', Object.assign({item_id:i.id}, v)));
  if (e === 'saida') abrirModal('Saída do estoque', sub, [
    {k:'unidade', label:'Para onde foi', tipo:'select', op:[{v:'', t:'Escolha…'}].concat(d.unidades, ['Uso interno / outro']), req:true},
    {k:'quantidade', label:'Quantidade', tipo:'number', req:true},
    {k:'chamado', label:'Nº do chamado (se tiver)', tipo:'lista', op:d.chamados.filter(ativo).map(c => c.id), ph:'C-0001'},
    {k:'obs', label:'Observação', tipo:'area', ph:'Ex.: reposição mensal'}
  ], 'Dar baixa', v => executar('saidaEstoque', Object.assign({item_id:i.id}, v)));
  if (e === 'ajuste') abrirModal('Ajustar saldo (contagem)', sub, [
    {k:'novo_saldo', label:'Saldo contado agora', tipo:'number', req:true},
    {k:'obs', label:'Motivo', tipo:'area', req:true, ph:'Contagem física, perda, quebra, vencido…'}
  ], 'Ajustar', v => executar('ajusteEstoque', Object.assign({item_id:i.id}, v)));
  if (e === 'editar' || e === 'novo') {
    const novo = e === 'novo';
    const campos = [
      {k:'departamento', label:'Categoria', tipo:'lista', op:cats, v:novo ? F.estCat : i.departamento, req:true},
      {k:'item', label:'Nome do item', v:novo ? '' : i.item, req:true},
      {k:'unidade_medida', label:'Unidade de medida', v:novo ? 'unidade' : i.unidade_medida, ph:'unidade, pacote, rolo, caixa…'},
      {k:'sinonimos', label:'Outros nomes para a busca (opcional)', v:novo ? '' : i.sinonimos, ph:'Ex.: para "Papel toalha": papel de mão, interfolha'},
      {k:'localizacao', label:'Onde fica no almoxarifado (opcional)', v:novo ? '' : i.localizacao, ph:'Ex.: prateleira 2, caixa azul'},
      {k:'estoque_minimo', label:'Estoque mínimo (alerta para repor)', tipo:'number', v:novo ? '' : i.estoque_minimo},
      {k:'custo_unitario', label:'Custo unitário (R$) — opcional', tipo:'number', v:novo ? '' : i.custo_unitario}
    ];
    if (novo) campos.push({k:'estoque_inicial', label:'Quantidade que já tem hoje', tipo:'number', v:0});
    else campos.push({k:'ativo', label:'Situação', tipo:'select', op:[{v:'sim', t:'Ativo'}, {v:'não', t:'Inativo (some da lista das filiais)'}], v:i.ativo === 'não' ? 'não' : 'sim'});
    abrirModal(novo ? 'Novo item' : 'Editar item', novo ? '' : 'O saldo só muda por Entrada, Saída ou Ajuste — tudo fica registrado.', campos, 'Salvar',
      v => executar('salvarItem', Object.assign(novo ? {} : {id:i.id}, v)));
  }
}

function saudacao(){ const h = new Date().getHours(); return h < 12 ? 'Bom dia' : h < 18 ? 'Boa tarde' : 'Boa noite'; }
function fraseDoDia(){ const d = new Date(), ini = new Date(d.getFullYear(), 0, 0); const n = Math.floor((d - ini) / 864e5); return FRASES[n % FRASES.length]; }

function pascoa(y){
  const a = y % 19, b = Math.floor(y / 100), c = y % 100, d = Math.floor(b / 4), e = b % 4, f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3),
    h = (19 * a + b - d - g + 15) % 30, i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - h - k) % 7, m = Math.floor((a + 11 * h + 22 * l) / 451),
    mes = Math.floor((h + l - 7 * m + 114) / 31), dia = ((h + l - 7 * m + 114) % 31) + 1;
  return new Date(y, mes - 1, dia);
}
const nDomingo = (y, m, n) => { const d = new Date(y, m, 1); return new Date(y, m, 1 + (7 - d.getDay()) % 7 + 7 * (n - 1)); };

    ['Natal', new Date(y,11,25), '🎄', 'Árvore, enfeites, luzes, confraternização da equipe']
  ].map(([nome, d, e, dica]) => ({nome, d, e, dica}));
  (S.d.datas || []).forEach(x => base.push({nome:x.nome, d:new Date(y, x.mes - 1, x.dia), e:'📌', dica:x.dica}));
  return base;
}
function proximasDatas(){
  const hoje = diaZero(new Date()), y = hoje.getFullYear();
  return datasDoAno(y).concat(datasDoAno(y + 1))
    .map(x => Object.assign(x, {falta: Math.round((diaZero(x.d) - hoje) / 864e5)}))
    .filter(x => x.falta >= 0 && x.falta <= 30).sort((a, b) => a.falta - b.falta);
}
const faltaTxt = f => f === 0 ? 'É hoje!' : f === 1 ? 'Amanhã' : `Faltam ${f} dias`;

function boasVindas(){
  const [cat, frase] = fraseDoDia();
  const transito = S.d.chamados.filter(c => c.status === 'Em trânsito');
  const datas = proximasDatas();
  return `<div class="hero"><div class="saud">${saudacao()}, equipe ${esc(S.unidade)}! 👋</div><div class="frase">“${esc(frase)}”<small>${esc(cat)} do dia</small></div></div>
  ${transito.length ? `<div class="card"><h3>🚗 A caminho da sua unidade</h3>${transito.map(c => `<div data-abrir="${esc(c.id)}" style="cursor:pointer">${byd(c)}</div>`).join('')}</div>` : ''}
  ${datas.length ? `<div class="card"><h3>📅 Datas chegando — vai precisar de algo?</h3><div class="datas">${datas.map(x => `<div class="data"><span class="em">${x.e}</span><div class="tx"><b>${esc(x.nome)} · ${x.d.toLocaleDateString('pt-BR')}</b><span>${esc(x.dica)}</span></div><div style="display:flex;flex-direction:column;gap:6px;align-items:flex-end"><span class="falta ${x.falta <= 7 ? 'hoje' : ''}">${faltaTxt(x.falta)}</span><button class="btn sm" data-paradata="${esc(x.nome)}">Pedir</button></div></div>`).join('')}</div></div>` : ''}`;
}

function topoGestao(){
  const [cat, frase] = fraseDoDia();
  const datas = proximasDatas();
  const al = analisar().lista.filter(a => a.nivel !== 'info').length;
  return `<div class="hero"><div class="saud">${saudacao()}, ${esc(S.d.usuario.nome)}! 👋</div><div class="frase">“${esc(frase)}”<small>${esc(cat)} do dia</small></div>
    <div class="chipsDatas">${al ? `<span data-aba="alertas" style="cursor:pointer;background:#f59e0b;color:#000;font-weight:700">⚠ ${al} alerta${al > 1 ? 's' : ''} para analisar</span>` : '<span>✅ Nenhum alerta de excesso ou repetição</span>'}${datas.map(x => `<span>${x.e} ${esc(x.nome)} — ${faltaTxt(x.falta).toLowerCase()}</span>`).join('')}</div></div>`;
}

function celebrar(c){
  $('#festaTx').textContent = (c.tipo === 'Reparo' ? 'Serviço ' : 'Pedido ') + c.id + ' concluído!';
  $('#festaGrat').textContent = GRATIDAO[Math.floor(Math.random() * GRATIDAO.length)];
  $('#festa').style.display = 'flex';
  confete();
  clearTimeout(window._festa); window._festa = setTimeout(fecharFesta, 6000);
}
function fecharFesta(){ $('#festa').style.display = 'none'; }
function confete(){
  const cv = $('#confete'), ctx = cv.getContext('2d');
  cv.width = innerWidth; cv.height = innerHeight;
  const cores = ['#111111','#16a34a','#f59e0b','#3b82f6','#ef4444','#a855f7','#ffffff'];
  const ps = Array.from({length:140}, () => ({x:Math.random() * cv.width, y:-20 - Math.random() * cv.height * .6, vx:(Math.random() - .5) * 3, vy:2 + Math.random() * 3.5, r:Math.random() * 6.28, vr:(Math.random() - .5) * .3, w:6 + Math.random() * 6, h:4 + Math.random() * 4, c:cores[Math.floor(Math.random() * cores.length)]}));
  const ini = performance.now();
  (function quadro(t){
    ctx.clearRect(0, 0, cv.width, cv.height);
    ps.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += .04; p.r += p.vr; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); ctx.restore(); });
    if (t - ini < 3800) requestAnimationFrame(quadro); else ctx.clearRect(0, 0, cv.width, cv.height);
  })(ini);
}

// ================= INTELIGÊNCIA: ALERTAS DE EXCESSO, DESPERDÍCIO E REPETIÇÃO =================
const TIPOS_AL = {
  repetido:['🔁','Pedido repetido'], excesso:['📈','Quantidade acima do normal'], rede:['⚖️','Consumo acima das outras filiais'],
  crescente:['📊','Consumo subindo'], reparo:['🔧','Reparo recorrente'], urgencia:['🚨','Urgência demais'], parado:['⏳','Parado sem andamento']
};
const chaveItem = l => l.item_id !== '' && l.item_id != null ? 'i' + l.item_id : 'l' + semAcento(l.item).replace(/[^a-z0-9]+/g, ' ').trim();
const mediana = a => { const b = a.slice().sort((x, y) => x - y), m = Math.floor(b.length / 2); return b.length % 2 ? b[m] : (b[m - 1] + b[m]) / 2; };
let _an = {d:null, r:null};

function analisar(){
  if (_an.d === S.d && _an.r) return _an.r;
  const d = S.d, cfg = d.alertas || {repeticao_dias:15, excesso_fator:2};
  const DIA = 864e5, agora = Date.now();
  const lista = [], porCh = {};
  const add = a => { lista.push(a); if (a.id) (porCh[a.id] = porCh[a.id] || []).push(a); };
  const validos = d.chamados.filter(c => c.status !== 'Cancelado');
  const L = [];
  validos.forEach(c => c.itens.forEach(l => L.push({c, l, k:chaveItem(l), t:new Date(c.aberto_em).getTime(), q:num(l.quantidade)})));
  const nId = c => parseInt(String(c.id).replace(/\D/g, ''), 10) || 0;
  L.sort((a, b) => a.t - b.t || nId(a.c) - nId(b.c) || num(a.l.linha) - num(b.l.linha));

  // 1) mesmo item pedido de novo pela mesma filial em pouco tempo
  L.forEach((x, i) => {
    if (agora - x.t > 45 * DIA) return;
    const ant = L.slice(0, i).filter(y => y.c.unidade === x.c.unidade && y.k === x.k && y.c.id !== x.c.id && x.t - y.t <= cfg.repeticao_dias * DIA);
    if (!ant.length) return;
    const u = ant[ant.length - 1], dias = Math.round((x.t - u.t) / DIA);
    add({tipo:'repetido', nivel:ant.length >= 2 ? 'alto' : 'medio', id:x.c.id, unidade:x.c.unidade, t:x.t,
      titulo:`${x.l.item} pedido de novo`,
      txt:`${x.c.unidade} pediu ${N(x.q)} ${x.l.unidade_medida} em ${dataBR(x.c.aberto_em)} e já tinha pedido ${N(u.q)} em ${dataBR(u.c.aberto_em)} (${u.c.id}) — ${dias === 0 ? 'no mesmo dia' : dias + ' dia' + (dias > 1 ? 's' : '') + ' antes'}${ant.length >= 2 ? `. São ${ant.length + 1} pedidos em ${cfg.repeticao_dias} dias` : ''}.`});
  });

  // 2) quantidade muito acima do normal daquele item
  L.forEach((x, i) => {
    if (agora - x.t > 45 * DIA) return;
    const hist = L.slice(0, i).filter(y => y.k === x.k).map(y => y.q);
    if (hist.length < 3) return;
    const med = mediana(hist);
    if (x.q >= 3 && x.q >= cfg.excesso_fator * med) add({tipo:'excesso', nivel:x.q >= 3 * med ? 'alto' : 'medio', id:x.c.id, unidade:x.c.unidade, t:x.t,
      titulo:`Quantidade alta de ${x.l.item}`, txt:`${x.c.unidade} pediu ${N(x.q)} ${x.l.unidade_medida}; o normal por pedido na rede é ${N(med)}.`});
  });

  // 3) filial consumindo bem mais que as outras (30 dias) — possível desperdício
  const rec = L.filter(x => agora - x.t <= 30 * DIA);
  const porItem = {};
  rec.forEach(x => { const o = porItem[x.k] = porItem[x.k] || {nome:x.l.item, un:x.l.unidade_medida, tot:{}}; o.tot[x.c.unidade] = (o.tot[x.c.unidade] || 0) + x.q; });
  const nUn = d.unidades.length;
  Object.values(porItem).forEach(o => {
    d.unidades.forEach(u => {
      const T = o.tot[u] || 0; if (T < 3) return;
      const outras = d.unidades.filter(v => v !== u).map(v => o.tot[v] || 0);
      const med = outras.reduce((a, b) => a + b, 0) / Math.max(1, nUn - 1);
      if (med > 0 && T >= 2 * med) add({tipo:'rede', nivel:T >= 3 * med ? 'alto' : 'medio', unidade:u, t:agora,
        titulo:`${u}: ${o.nome} acima da média`, txt:`Nos últimos 30 dias ${u} pediu ${N(T)} ${o.un}; a média das outras filiais foi ${N(Math.round(med * 10) / 10)}. Vale conferir se há desperdício ou estoque parado na unidade.`});
    });
  });

  // 4) consumo total da filial subindo (30 dias vs média dos 90 anteriores)
  d.unidades.forEach(u => {
    const cur = L.filter(x => x.c.unidade === u && agora - x.t <= 30 * DIA).reduce((s, x) => s + x.q, 0);
    const antes = L.filter(x => x.c.unidade === u && agora - x.t > 30 * DIA && agora - x.t <= 120 * DIA);
    if (!antes.length) return;
    const media = antes.reduce((s, x) => s + x.q, 0) / 3;
    if (media > 0 && cur >= 1.5 * media && cur - media >= 10) add({tipo:'crescente', nivel:'medio', unidade:u, t:agora,
      titulo:`${u} está pedindo mais`, txt:`${N(cur)} itens pedidos nos últimos 30 dias, contra uma média de ${N(Math.round(media))} por mês nos 3 meses anteriores (+${Math.round((cur / media - 1) * 100)}%).`});
  });

  // 5) reparo recorrente no mesmo local (60 dias)
  const reps = validos.filter(c => c.tipo === 'Reparo').map(c => ({c, t:new Date(c.aberto_em).getTime(), loc:semAcento(c.local).replace(/[^a-z0-9]+/g, ' ').trim()})).sort((a, b) => a.t - b.t || nId(a.c) - nId(b.c));
  reps.forEach((x, i) => {
    if (agora - x.t > 60 * DIA || !x.loc) return;
    const ant = reps.slice(0, i).filter(y => y.c.unidade === x.c.unidade && x.t - y.t <= 60 * DIA && y.loc && (y.loc === x.loc || y.loc.includes(x.loc) || x.loc.includes(y.loc)));
    if (ant.length) add({tipo:'reparo', nivel:'alto', id:x.c.id, unidade:x.c.unidade, t:x.t,
      titulo:`Reparo de novo: ${x.c.local}`, txt:`${x.c.unidade} já abriu ${ant.length} chamado${ant.length > 1 ? 's' : ''} para "${ant[ant.length - 1].c.local}" nos últimos 60 dias (${ant.map(a => a.c.id).join(', ')}). Pode ser hora de resolver a causa ou trocar o equipamento.`});
  });

  // 6) urgência demais (30 dias)
  d.unidades.forEach(u => {
    const ch = validos.filter(c => c.unidade === u && agora - new Date(c.aberto_em).getTime() <= 30 * DIA);
    const urg = ch.filter(c => c.prioridade === 'Urgente').length;
    if (ch.length >= 4 && urg / ch.length >= 0.5) add({tipo:'urgencia', nivel:'medio', unidade:u, t:agora,
      titulo:`${u} usa muito o "Urgente"`, txt:`${urg} de ${ch.length} chamados dos últimos 30 dias foram marcados como urgentes. Quando tudo é urgente, nada é — vale alinhar com a liderança.`});
  });

  // 7) chamados parados
  d.chamados.filter(ativo).forEach(c => {
    const ref = new Date(c.atualizado_em || c.aberto_em).getTime(), dias = Math.floor((agora - ref) / DIA);
    const regra = {'Visto':[2,'visto e sem ação'], 'Separado':[2,'separado e ainda não saiu'], 'Em trânsito':[2,'em trânsito e a filial não confirmou'], 'Pendência na entrega':[1,'com pendência de entrega sem resposta'], 'Aguardando orçamento':[5,'aguardando orçamento']}[c.status];
    if (regra && dias >= regra[0]) add({tipo:'parado', nivel:'info', id:c.id, unidade:c.unidade, t:ref,
      titulo:`${c.id} parado há ${dias} dias`, txt:`${c.unidade} · ${c.resumo} — ${regra[1]}.`});
  });

  const ordem = {alto:0, medio:1, info:2};
  lista.sort((a, b) => ordem[a.nivel] - ordem[b.nivel] || b.t - a.t);
  _an = {d:S.d, r:{lista, porCh}};
  return _an.r;
}

function viewAlertas(){
  const {lista} = analisar(), cfg = S.d.alertas || {};
  const cont = k => lista.filter(a => !k || a.tipo === k).length;
  const f = F.alTipo || '';
  const vis = lista.filter(a => !f || a.tipo === f);
  return `${topoGestao()}
  <div class="inf" style="margin-bottom:12px">O painel analisa sozinho todos os chamados e aponta o que merece atenção <b>antes de executar</b>: pedidos repetidos em até ${cfg.repeticao_dias || 15} dias, quantidades ${cfg.excesso_fator || 2}× acima do normal, filiais consumindo bem mais que as outras, consumo subindo, reparos que se repetem, excesso de urgência e chamados parados. Os alertas também aparecem dentro de cada chamado.</div>
  <div class="chips" data-ctx="alertas"><button data-g="" class="${!f ? 'on' : ''}">Todos (<b>${cont('')}</b>)</button>${Object.keys(TIPOS_AL).map(k => cont(k) || f === k ? `<button data-g="${k}" class="${f === k ? 'on' : ''}">${TIPOS_AL[k][0]} ${TIPOS_AL[k][1]} (<b>${cont(k)}</b>)</button>` : '').join('')}</div>
  ${vis.length ? vis.map(a => `<div class="al ${a.nivel}"><span class="ic">${TIPOS_AL[a.tipo][0]}</span><div class="tx"><small>${TIPOS_AL[a.tipo][1]} · ${esc(a.unidade || '')}</small><b>${esc(a.titulo)}</b><div>${esc(a.txt)}</div></div>${a.id ? `<button class="btn sm" data-abrir="${esc(a.id)}" style="align-self:center">Abrir ${esc(a.id)}</button>` : ''}</div>`).join('')
    : '<div class="card vazio">✅ Nenhum alerta agora. A rede está pedindo dentro do normal.</div>'}`;
}

// aviso para o líder: item já pedido há pouco tempo
function pedidoRecente(l){
  const dias = (S.d.alertas || {}).repeticao_dias || 15, k = chaveItem(l), lim = Date.now() - dias * 864e5;
  let achou = null;
  S.d.chamados.filter(c => c.status !== 'Cancelado' && new Date(c.aberto_em).getTime() >= lim)
    .forEach(c => c.itens.forEach(x => { if (chaveItem(x) === k && (!achou || c.aberto_em > achou.c.aberto_em)) achou = {c, l:x}; }));
  return achou;
}

// ================= EVENTOS =================
document.addEventListener('click', ev => {
  const t = ev.target;
  const el = s => t.closest(s);
  let b;
  if ((b = el('[data-sug]'))) { ev.preventDefault(); const i = document.getElementById(b.dataset.sug); if (i) { i.value = b.dataset.v; i.dispatchEvent(new Event('input', {bubbles:true})); } return; }
  if ((b = el('[data-fecharfesta]')) || t.id === 'festa') { fecharFesta(); return; }
  if ((b = el('[data-paradata]'))) { S.novo = {tipo:'Material', carrinho:[], busca:'', cat:'', fotos:[], prioridade:'Normal', obs:'Para: ' + b.dataset.paradata}; S.aba = 'novo'; render(); window.scrollTo(0,0); toast('Monte o pedido para ' + b.dataset.paradata + '.'); return; }
  if ((b = el('[data-fechar]'))) { ev.preventDefault(); b.dataset.fechar === 'det' ? fecharDet() : fecharModal(); return; }
  if (t.id === 'det') { fecharDet(); return; }
  if (t.id === 'modal') { fecharModal(); return; }
  if ((b = el('[data-aba]'))) { S.aba = b.dataset.aba; render(); window.scrollTo(0,0); return; }
  if ((b = el('[data-x]'))) { acaoDetalhe(b.dataset.x); return; }
  if ((b = el('[data-abrir]'))) { ev.preventDefault(); abrirDetalhe(b.dataset.abrir); return; }
  if ((b = el('[data-ir]'))) { F.grupo = b.dataset.ir; S.aba = 'fila'; render(); return; }
  if ((b = el('[data-g]'))) { const ctx = b.closest('[data-ctx]').dataset.ctx; if (ctx === 'meus') F.meus = b.dataset.g; else if (ctx === 'alertas') F.alTipo = b.dataset.g; else F.grupo = b.dataset.g; render(); return; }
  if ((b = el('[data-e]'))) { acaoEstoque(b.dataset.e, b.dataset.id); return; }
  // novo pedido
  if ((b = el('[data-tipo]'))) { S.novo.tipo = b.dataset.tipo; render(); return; }
  if ((b = el('[data-add]'))) { adicionarItem(b.dataset.add); return; }
  if ((b = el('[data-cat]'))) { S.novo.cat = S.novo.cat === b.dataset.cat ? '' : b.dataset.cat; document.querySelectorAll('#nvCats [data-cat]').forEach(x => x.classList.toggle('on', x.dataset.cat === S.novo.cat)); renderBusca(); return; }
  if ((b = el('[data-livre]'))) { itemLivre(); return; }
  if ((b = el('[data-rm]'))) { S.novo.carrinho.splice(+b.dataset.rm, 1); renderCarrinho(); renderBusca(); return; }
  if ((b = el('[data-rmfoto]'))) { S.novo.fotos.splice(+b.dataset.rmfoto, 1); renderFotos(); return; }
});
document.addEventListener('change', ev => {
  const mapa = {fUn:'unidade', fPrio:'prio', eCat:'estCat', mMes:'movMes', mDest:'movDest', mTipo:'movTipo', lUn:'logUn'};
  if (mapa[ev.target.id]) { F[mapa[ev.target.id]] = ev.target.value; render(); }
  if (ev.target.id === 'eBaixo') { F.estBaixo = ev.target.checked; render(); }
});
document.addEventListener('input', ev => {
  const mapa = {fBusca:'busca', eBusca:'estBusca', lBusca:'logBusca'};
  const id = ev.target.id;
  if (mapa[id]) { F[mapa[id]] = ev.target.value; clearTimeout(window._bt); window._bt = setTimeout(() => { render(); const e = document.getElementById(id); if (e) { e.focus(); e.setSelectionRange(e.value.length, e.value.length); } }, 300); }
});
document.addEventListener('keydown', ev => { if (ev.key === 'Escape') { if ($('#modal').style.display === 'flex') fecharModal(); else if ($('#det').style.display === 'flex') fecharDet(); } });

iniciar();
</script>
