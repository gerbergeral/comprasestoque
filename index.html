<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pedidos e Estoque · Rede Gerber</title>
<style>
:root{
  --bg:#f3f4f6;--card:#fff;--ink:#1c2230;--mut:#6b7280;--line:#e5e7eb;
  --pri:#0f766e;--pri2:#115e59;--pril:#ccfbf1;
  --am:#92400e;--amb:#fef3c7;--az:#1e40af;--azb:#dbeafe;--ro:#5b21b6;--rob:#ede9fe;--la:#9a3412;--lab:#ffedd5;
  --vc:#155e75;--vcb:#cffafe;--te:#0f766e;--teb:#ccfbf1;--vd:#065f46;--vdb:#d1fae5;--vm:#991b1b;--vmb:#fee2e2;--cz:#374151;--czb:#e5e7eb
}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.4}
header{background:var(--ink);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;position:sticky;top:0;z-index:20}
header h1{font-size:16px;margin:0;flex:1;font-weight:650;letter-spacing:.2px;min-width:180px}
header .chip{background:rgba(255,255,255,.12);padding:4px 10px;border-radius:99px;font-size:13px}
header button{background:transparent;border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:8px;padding:6px 10px;cursor:pointer;font-size:13px}
main{max-width:1150px;margin:0 auto;padding:16px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px;padding-bottom:2px}
.tabs button{border:1px solid var(--line);background:var(--card);padding:9px 14px;border-radius:10px;cursor:pointer;white-space:nowrap;font-size:14px;color:var(--ink)}
.tabs button.on{background:var(--pri);border-color:var(--pri);color:#fff}
.n{display:inline-block;min-width:20px;padding:0 6px;margin-left:6px;border-radius:99px;background:var(--vmb);color:var(--vm);font-size:12px;font-weight:700;text-align:center}
.tabs button.on .n{background:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.card h2{font-size:17px;margin:0 0 12px}
.card h3{font-size:15px;margin:0 0 10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.full{grid-column:1/-1}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mut);font-weight:600}
input,select,textarea{font:inherit;font-size:15px;color:var(--ink);border:1px solid #d1d5db;border-radius:9px;padding:9px 10px;background:#fff;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--pril);border-color:var(--pri)}
.btn{border:1px solid #d1d5db;background:#fff;color:var(--ink);border-radius:9px;padding:8px 12px;cursor:pointer;font-size:14px;font-weight:600;font-family:inherit}
.btn:hover{background:#f9fafb}
.btn.prim{background:var(--pri);border-color:var(--pri);color:#fff;padding:11px 14px}
.btn.prim:hover{background:var(--pri2)}
.btn.ok{background:var(--vdb);border-color:#a7f3d0;color:var(--vd)}
.btn.no{background:var(--vmb);border-color:#fecaca;color:var(--vm)}
.btn.sm{padding:5px 9px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.hid{display:none!important}
.muted{color:var(--mut)}
.peq{font-size:13px}
.filtros{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.filtros select,.filtros input{width:auto;min-width:140px;flex:1}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chips button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 12px;cursor:pointer;font-size:13px;font-family:inherit;color:var(--ink)}
.chips button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chips button b{font-weight:700}
.ped{border:1px solid var(--line);border-left:4px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;background:#fff;cursor:pointer}
.ped:hover{box-shadow:0 2px 10px rgba(0,0,0,.06)}
.ped.urg{border-left-color:#dc2626}
.ped.atr{background:#fff7f7}
.ped-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:4px}
.ped-desc{font-weight:600;margin-bottom:6px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.meta{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px;color:var(--mut)}
.pill{font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;white-space:nowrap}
.s-pendente{background:var(--amb);color:var(--am)}
.s-visto{background:var(--azb);color:var(--az)}
.s-aguardando-orcamento{background:var(--lab);color:var(--la)}
.s-em-compra{background:var(--rob);color:var(--ro)}
.s-em-separacao{background:var(--vcb);color:var(--vc)}
.s-separado{background:var(--teb);color:var(--te)}
.s-pendencia-na-entrega{background:var(--vmb);color:var(--vm)}
.s-entregue{background:var(--vdb);color:var(--vd)}
.s-cancelado{background:var(--czb);color:var(--cz)}
.tag{font-size:11.5px;font-weight:700;padding:2px 7px;border-radius:99px;background:var(--vmb);color:var(--vm);white-space:nowrap}
.tag.cinza{background:var(--czb);color:var(--cz)}
.atrasado{color:var(--vm);font-weight:700}
.hoje{color:var(--am);font-weight:700}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.kpi b{display:block;font-size:26px;line-height:1.1}
.kpi span{font-size:12.5px;color:var(--mut);font-weight:600}
.kpi.alerta b{color:var(--vm)}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.3px;background:#f9fafb;white-space:nowrap}
td.num,th.num{text-align:right;white-space:nowrap}
tr.baixo td{background:#fff7ed}
.vazio{color:var(--mut);text-align:center;padding:24px}
/* login */
#login{max-width:380px;margin:40px auto}
#login .logo{font-size:13px;letter-spacing:2px;color:var(--pri);font-weight:800;margin-bottom:4px}
/* novo pedido */
.tipos{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tipo{border:2px solid var(--line);border-radius:14px;background:#fff;padding:20px 16px;text-align:left;cursor:pointer;font-family:inherit;color:var(--ink)}
.tipo:hover{border-color:var(--pri)}
.tipo .ic{font-size:30px;display:block;margin-bottom:8px}
.tipo b{font-size:16px;display:block;margin-bottom:4px}
.tipo span{font-size:13px;color:var(--mut)}
.voltar{background:none;border:0;color:var(--pri);font-weight:600;cursor:pointer;padding:0;font-size:14px;font-family:inherit;margin-bottom:10px}
.resultados{border:1px solid var(--line);border-radius:10px;max-height:330px;overflow:auto;margin-top:8px}
.res{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 10px;border-bottom:1px solid var(--line)}
.res:last-child{border-bottom:0}
.res .cat{font-size:12px;color:var(--mut)}
.res button{flex:none}
.livre{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:#f9fafb;border:1px dashed #cbd5e1;border-radius:10px;padding:10px;margin-top:8px;font-size:14px}
.guia{font-size:13px;color:var(--mut);margin-top:6px}
.carr{border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px;display:grid;grid-template-columns:1fr 90px 34px;gap:8px;align-items:center}
.carr .nome{font-weight:600;font-size:14px}
.carr .nome small{display:block;color:var(--mut);font-weight:500}
.carr input{padding:7px 8px}
.carr .obs{grid-column:1/-1}
.rm{border:0;background:var(--vmb);color:var(--vm);border-radius:8px;width:34px;height:34px;cursor:pointer;font-size:18px}
.prios{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.prio{border:2px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;display:flex;gap:8px;align-items:flex-start;color:var(--ink);font-weight:600;font-size:14px;flex-direction:row}
.prio input{width:auto;margin-top:3px}
.prio small{display:block;color:var(--mut);font-weight:500}
.prio.on{border-color:var(--pri);background:#f0fdfa}
.prio.on.urgente{border-color:#dc2626;background:#fef2f2}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.thumbs .t{position:relative;width:86px;height:86px;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:#f3f4f6}
.thumbs img{width:100%;height:100%;object-fit:cover;display:block}
.thumbs .t button{position:absolute;top:3px;right:3px;border:0;border-radius:99px;width:22px;height:22px;background:rgba(0,0,0,.6);color:#fff;cursor:pointer;line-height:1}
.fotoBtn{display:inline-flex;align-items:center;gap:6px;border:1px dashed #94a3b8;border-radius:10px;padding:10px 12px;cursor:pointer;color:var(--ink);font-weight:600;font-size:14px;flex-direction:row}
.fotoBtn input{display:none}
/* linha do tempo */
.tl{display:flex;align-items:flex-start;margin:10px 0 4px}
.tl .p{flex:1;text-align:center;font-size:11.5px;color:var(--mut);position:relative}
.tl .p:before{content:"";position:absolute;top:7px;left:-50%;width:100%;height:3px;background:var(--line);z-index:0}
.tl .p:first-child:before{display:none}
.tl .p i{display:block;width:16px;height:16px;border-radius:99px;background:#fff;border:3px solid var(--line);margin:0 auto 4px;position:relative;z-index:1}
.tl .p.f i{background:var(--pri);border-color:var(--pri)}
.tl .p.f:before{background:var(--pri)}
.tl .p.a{color:var(--ink);font-weight:700}
.tl .p.a i{border-color:var(--pri);background:#fff;box-shadow:0 0 0 4px var(--pril)}
/* detalhe */
.ov{position:fixed;inset:0;background:rgba(17,24,39,.45);display:none;align-items:flex-end;justify-content:center;z-index:40;padding:12px}
.ov .caixa{background:#fff;border-radius:16px;padding:18px;width:100%;max-width:470px;max-height:92vh;overflow:auto;position:relative}
.ov .caixa.larga{max-width:760px}
#modal{z-index:45}
.fechar{position:absolute;top:10px;right:10px;border:0;background:#f3f4f6;border-radius:99px;width:32px;height:32px;font-size:18px;cursor:pointer}
.info{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px 14px;font-size:14px;margin:12px 0}
.info div span{display:block;font-size:12px;color:var(--mut);font-weight:600}
.hist{list-style:none;margin:0;padding:0;font-size:13px}
.hist li{padding:7px 0;border-bottom:1px solid var(--line)}
.hist li b{font-weight:600}
.acoes{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.secao{font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:var(--mut);font-weight:700;margin:16px 0 6px}
.caixaTxt{background:#f9fafb;border-radius:10px;padding:10px;font-size:14px;white-space:pre-wrap}
#modal h3{margin:0 0 4px;font-size:17px;padding-right:30px}
#modal .sub{font-size:13px;color:var(--mut);margin-bottom:12px}
#modal form{display:flex;flex-direction:column;gap:10px}
#modal .bts{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}
.sug{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.sug button{border:1px solid var(--line);background:#f9fafb;border-radius:99px;padding:5px 11px;font-size:13px;cursor:pointer;font-family:inherit;color:var(--ink);font-weight:600}
.sug button:hover{border-color:var(--pri)}
.inf{font-size:13px;background:#f9fafb;border-radius:8px;padding:8px 10px;color:var(--ink)}
#toast{pointer-events:none;position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 16px;border-radius:10px;font-size:14px;z-index:60;max-width:92vw;display:none;box-shadow:0 6px 24px rgba(0,0,0,.25)}
#toast.erro{background:#b91c1c}
#carga{position:fixed;inset:0;background:rgba(255,255,255,.55);display:none;align-items:center;justify-content:center;z-index:55}
#carga div{width:38px;height:38px;border:4px solid var(--pril);border-top-color:var(--pri);border-radius:50%;animation:g .8s linear infinite}
@keyframes g{to{transform:rotate(360deg)}}
@media(min-width:700px){.ov{align-items:center}}
@media(max-width:640px){.grid,.tipos,.prios{grid-template-columns:1fr}main{padding:12px}.carr{grid-template-columns:1fr 80px 34px}}
</style>
</head>
<body>
<header>
  <h1>Pedidos &amp; Estoque · Rede Gerber</h1>
  <span id="quem" class="chip hid"></span>
  <button id="btAtualizar" class="hid">↻ Atualizar</button>
  <button id="btSair" class="hid">Sair</button>
</header>

<main>
  <section id="login" class="card">
    <div class="logo">REDE GERBER</div>
    <h2>Entrar</h2>
    <form id="fLogin" style="display:flex;flex-direction:column;gap:12px">
      <label>Acesso
        <select id="lgAcesso" required><option value="">Carregando…</option></select>
      </label>
      <label>Senha
        <input id="lgSenha" type="password" autocomplete="current-password" required>
      </label>
      <button class="btn prim" type="submit">Entrar</button>
      <div id="lgErro" class="muted peq"></div>
    </form>
  </section>
  <section id="app" class="hid">
    <nav class="tabs" id="tabs"></nav>
    <div id="view"></div>
  </section>
</main>

<div id="det" class="ov"><div class="caixa larga"><button class="fechar" data-fechar="det">×</button><div id="detC"></div></div></div>
<div id="modal" class="ov"><div class="caixa"><button class="fechar" data-fechar="modal">×</button><h3 id="mdTit"></h3><div class="sub" id="mdSub"></div><form id="mdForm"></form></div></div>
<div id="carga"><div></div></div>
<div id="toast"></div>

<script>
// ============ CONFIGURAÇÃO: link /exec do Apps Script ============
const API = 'https://script.google.com/macros/s/AKfycbyfetXgIXuKpcR4kgD0pMnuPFlO_OXuA4t8vWIpeconb_M05oscwN3cBXUfvktsNDhl/exec';
// ================================================================

const ATIVOS = ['Pendente','Visto','Aguardando orçamento','Em compra','Em separação','Separado','Pendência na entrega'];
const CONFIRMAVEIS = ['Visto','Aguardando orçamento','Em compra','Em separação','Separado','Pendência na entrega'];
const S = {perfil:'', unidade:'', senha:'', d:null, aba:'', detId:'', nome:'',
  novo:{tipo:'', carrinho:[], busca:'', cat:'', fotos:[], prioridade:'Normal'}};
const F = {meus:'andamento', grupo:'abertos', unidade:'', prio:'', busca:'', estCat:'', estBusca:'', estBaixo:false, movMes:'', movDest:'', movTipo:'', logBusca:'', logUn:''};

// ---------- utilidades
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => { const n = parseFloat(String(v == null ? '' : v).replace(',', '.')); return isNaN(n) ? 0 : n; };
const N = v => num(v).toLocaleString('pt-BR', {maximumFractionDigits:2});
const R = v => num(v).toLocaleString('pt-BR', {style:'currency', currency:'BRL'});
const dataBR = s => { if (!s) return ''; const p = String(s).slice(0,10).split('-'); return p.length === 3 ? p[2]+'/'+p[1]+'/'+p[0] : String(s); };
const horaBR = s => s && String(s).length > 15 ? String(s).slice(11,16) : '';
const dataHora = s => s ? dataBR(s) + (horaBR(s) ? ' ' + horaBR(s) : '') : '';
const semAcento = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
const slug = s => semAcento(s).replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
const hojeISO = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0,10); };
const diaZero = s => { const d = new Date(s); d.setHours(0,0,0,0); return d; };
const mesDe = s => String(s || '').slice(0,7);
const nomeMes = m => { if (!m) return ''; const [a, mm] = m.split('-'); return ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'][+mm-1] + '/' + a; };
const gestao = () => S.perfil === 'gestao';
const ativo = c => ATIVOS.includes(c.status);
let _uid = 0;

function rotulo(st, tipo){
  if (tipo === 'Reparo') {
    if (st === 'Em separação') return 'Em execução';
    if (st === 'Separado') return 'Serviço concluído';
    if (st === 'Entregue') return 'Finalizado';
  }
  if (st === 'Separado') return 'Separado p/ entrega';
  return st;
}
const sugestoes = (alvo, ops) => ops.length ? `<div class="sug">${ops.slice(0, 12).map(o => `<button type="button" data-sug="${esc(alvo)}" data-v="${esc(o)}">${esc(o)}</button>`).join('')}</div>` : '';
const pill = c => `<span class="pill s-${slug(c.status)}">${esc(rotulo(c.status, c.tipo))}</span>`;

function prazoInfo(c){
  if (!c.prazo) return {txt:'', cls:'', atrasado:false};
  if (c.status === 'Entregue') {
    const dr = c.confirmado_em || c.data_recebimento;
    const noPrazo = dr && diaZero(dr) <= diaZero(c.prazo);
    return {txt: noPrazo ? 'Entregue no prazo' : 'Entregue fora do prazo', cls: noPrazo ? '' : 'atrasado', atrasado:false};
  }
  if (!ativo(c)) return {txt:'', cls:'', atrasado:false};
  if (c.status === 'Separado') return {txt:'Aguardando confirmação da filial', cls:'', atrasado:false};
  const dias = Math.round((diaZero(c.prazo) - diaZero(new Date())) / 864e5);
  if (dias < 0) return {txt:`Atrasado ${-dias} dia${dias === -1 ? '' : 's'}`, cls:'atrasado', atrasado:true};
  if (dias === 0) return {txt:'Vence hoje', cls:'hoje', atrasado:false};
  return {txt:`Prazo ${dataBR(c.prazo)} (${dias} dia${dias === 1 ? '' : 's'})`, cls:'', atrasado:false};
}

function timeline(c){
  if (c.status === 'Cancelado') return `<div class="inf" style="background:var(--czb)">Cancelado em ${dataHora(c.cancelado_em)} por <b>${esc(c.cancelado_por)}</b> — ${esc(c.motivo_cancelamento)}</div>`;
  const rep = c.tipo === 'Reparo';
  const passos = ['Pendente','Visto', rep ? 'Em execução' : 'Em separação / compra', rep ? 'Concluído' : 'Separado', rep ? 'Finalizado' : 'Entregue'];
  const idx = {'Pendente':0,'Visto':1,'Aguardando orçamento':2,'Em compra':2,'Em separação':2,'Pendência na entrega':2,'Separado':3,'Entregue':4}[c.status] ?? 0;
  return `<div class="tl">${passos.map((p, i) => `<div class="p ${i < idx || c.status === 'Entregue' ? 'f' : ''} ${i === idx && c.status !== 'Entregue' ? 'a' : ''}"><i></i>${esc(i === 2 && idx === 2 ? rotulo(c.status, c.tipo) : p)}</div>`).join('')}</div>`;
}

function toast(msg, erro){ const t = $('#toast'); t.textContent = msg; t.className = erro ? 'erro' : ''; t.style.display = 'block'; clearTimeout(t._t); t._t = setTimeout(() => t.style.display = 'none', erro ? 7000 : 3500); }
function carga(on){ $('#carga').style.display = on ? 'flex' : 'none'; }
function lembrarNome(n){ if (!n) return; S.nome = n; try { localStorage.setItem('gerberNome_' + S.unidade, n); } catch (e) {} }

async function chamar(acao, p, silencioso){
  if (!silencioso) carga(true);
  try {
    const corpo = {acao, perfil:S.perfil, unidade:S.unidade, senha:S.senha};
    if (p) corpo.p = p;
    const r = await fetch(API, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify(corpo)});
    const j = await r.json();
    if (!j.ok) throw new Error(j.erro || 'Erro desconhecido');
    return j;
  } catch (e) {
    if (e instanceof TypeError || e instanceof SyntaxError) throw new Error('Erro ao conectar. Confira a internet e tente de novo.');
    throw e;
  } finally { if (!silencioso) carga(false); }
}

async function executar(acao, p, depois){
  try {
    const j = await chamar(acao, p);
    S.d = j; fecharModal();
    if (depois) depois();
    render(); if (S.detId) renderDetalhe();
    if (j.msg) toast(j.msg);
    return true;
  } catch (e) { toast(e.message, true); return false; }
}

// ---------- fotos (reduz no celular antes de enviar)
async function reduzir(file){
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((ok, erro) => { const i = new Image(); i.onload = () => ok(i); i.onerror = erro; i.src = url; });
    const max = 1280, k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const cv = document.createElement('canvas');
    cv.width = Math.round(img.naturalWidth * k); cv.height = Math.round(img.naturalHeight * k);
    cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
    return cv.toDataURL('image/jpeg', 0.75);
  } finally { URL.revokeObjectURL(url); }
}
async function lerFotos(files, limite){
  const out = [];
  for (const f of Array.from(files || []).slice(0, limite)) {
    if (!/^image\//.test(f.type)) continue;
    try { out.push(await reduzir(f)); } catch (e) { toast('Não consegui ler uma das fotos.', true); }
  }
  return out;
}

function buscarCatalogo(q, cat){
  const toks = semAcento(q).split(/\s+/).filter(Boolean);
  const exemplos = {}; S.d.categorias.forEach(c => exemplos[c.nome] = c.exemplos);
  let lista = S.d.catalogo.filter(i => !cat || i.departamento === cat);
  if (toks.length) {
    lista = lista.map(i => {
      const nome = semAcento(i.item), hay = nome + ' ' + semAcento(i.departamento + ' ' + i.sinonimos + ' ' + (exemplos[i.departamento] || ''));
      if (!toks.every(t => hay.includes(t))) return null;
      const score = (nome.startsWith(toks[0]) ? 0 : 1) + (toks.every(t => nome.includes(t)) ? 0 : 2);
      return {i, score};
    }).filter(Boolean).sort((a, b) => a.score - b.score || a.i.item.localeCompare(b.i.item)).map(x => x.i);
  } else {
    lista = lista.slice().sort((a, b) => a.item.localeCompare(b.item));
  }
  return lista;
}

function viewGeral(){

  const atrasados = abertos.filter(x => prazoInfo(x).atrasado);

  const kp = (n, t, al, g) => `<div class="kpi ${al && n ? 'alerta' : ''}" ${g ? `data-ir="${esc(g)}" style="cursor:pointer"` : ''}><b>${n}</b><span>${t}</span></div>`;

  const desde = Date.now() - 90 * 864e5;
  const fechados = C.filter(x => x.status === 'Entregue' && x.confirmado_em && new Date(x.confirmado_em).getTime() >= desde);
  const tempo = u => {
    const l = fechados.filter(x => x.unidade === u); if (!l.length) return ['–','–',0];
    const med = l.reduce((s, x) => s + (new Date(x.confirmado_em) - new Date(x.aberto_em)) / 864e5, 0) / l.length;
    const np = l.filter(x => diaZero(x.confirmado_em) <= diaZero(x.prazo)).length;
    return [N(Math.round(med * 10) / 10) + ' d', Math.round(np / l.length * 100) + '%', l.length];
  };
  return `<div class="kpis">
    ${kp(c('Pendente'), 'Pendentes — ninguém viu ainda', true, 'Pendente')}
    ${kp(c('Visto'), 'Vistos, sem ação', true, 'Visto')}
    ${kp(c('Aguardando orçamento'), 'Aguardando orçamento', false, 'Aguardando orçamento')}
    ${kp(c('Em compra'), 'Em compra', false, 'Em compra')}
    ${kp(c('Em separação'), 'Em separação / execução', false, 'Em separação')}
    ${kp(c('Separado'), 'Separados, aguardando confirmação da filial', false, 'Separado')}
    ${kp(c('Pendência na entrega'), 'Pendência na entrega', true, 'Pendência na entrega')}
    ${kp(atrasados.length, 'Atrasados (passou o prazo)', true, 'atrasados')}
    ${kp(abertos.filter(x => x.prioridade === 'Urgente').length, 'Urgentes em aberto', true, 'abertos')}
    ${kp(baixos.length, 'Itens no estoque mínimo', true)}

async function abrirDetalhe(id){
  S.detId = id; renderDetalhe(); $('#det').style.display = 'flex';
  const c = S.d.chamados.find(x => x.id === id);
  if (gestao() && c && c.status === 'Pendente') {
    try { S.d = await chamar('marcarVisto', {id}, true); render(); if (S.detId === id) renderDetalhe(); } catch (e) {}
  }
}

    <div class="info">

      ${inf('Aberto em', dataHora(c.aberto_em))}
      ${inf('Prazo', dataBR(c.prazo))}
      ${inf('Categoria', esc(c.categoria))}
      ${inf('Local / equipamento', esc(c.local))}
      ${inf('Visto por', c.visto_por ? esc(c.visto_por) + ' em ' + dataHora(c.visto_em) : '')}
      ${inf('Orçamento', c.orcamento_valor ? R(c.orcamento_valor) + ' — ' + esc(c.orcamento_status) + (c.orcamento_por ? ' por ' + esc(c.orcamento_por) : '') + (c.orcamento_obs ? '<br><span class="muted">' + esc(c.orcamento_obs) + '</span>' : '') : '')}
      ${inf('Separado por', c.separado_por ? esc(c.separado_por) + ' em ' + dataHora(c.separado_em) : '')}

    ${c.itens.length ? `<div class="secao">Itens (${c.itens.length})</div><div class="tw"><table><thead><tr><th>Item</th><th>Categoria</th><th class="num">Qtd</th><th>Detalhe</th>${gestao() ? '<th class="num">Baixado</th><th class="num">Saldo hoje</th>' : ''}</tr></thead><tbody>
      ${c.itens.map(l => { const it = l.item_id !== '' ? saldo(l.item_id) : null; return `<tr><td>${esc(l.item)}${l.item_id === '' ? ' <span class="tag cinza">livre</span>' : ''}</td><td>${esc(l.departamento)}</td><td class="num">${N(l.quantidade)} ${esc(l.unidade_medida)}</td><td>${esc(l.obs)}</td>${gestao() ? `<td class="num">${l.qtd_baixada !== '' ? N(l.qtd_baixada) : '–'}</td><td class="num">${it ? (String(it.estoque_atual) === '' ? '<span class="muted">sem contagem</span>' : N(it.estoque_atual)) : '–'}</td>` : ''}</tr>`; }).join('')}
    </tbody></table></div>` : ''}

    <ul class="hist">${hist.map(h => { const m = h.match(/^(\S+ \S+) — ([^:]+): (.*)$/); return m ? `<li><span class="muted">${esc(m[1])}</span> — <b>${esc(m[2])}</b>: ${esc(m[3])}</li>` : `<li>${esc(h)}</li>`; }).join('')}</ul>`;

function acoesDetalhe(c){
  const bt = (x, t, cls) => `<button class="btn sm ${cls || ''}" data-x="${esc(x)}">${t}</button>`;
  const at = ativo(c), rep = c.tipo === 'Reparo';
  let h = '';
  if (gestao()) {
    if (at) {
      if (c.status !== 'Em separação') h += bt('mv:Em separação', rep ? 'Em execução' : 'Em separação');
      if (c.status !== 'Em compra') h += bt('mv:Em compra', 'Em compra');
      if (c.status !== 'Aguardando orçamento') h += bt('mv:Aguardando orçamento', 'Aguardando orçamento');
      h += bt('mv:Separado', rep ? 'Serviço concluído' : (c.status === 'Separado' ? 'Atualizar entrega' : 'Separado p/ entrega'), 'ok');
      if (c.status === 'Aguardando orçamento' || c.orcamento_valor) {
        h += bt('orc:informar', c.orcamento_valor ? 'Novo valor de orçamento' : 'Informar orçamento');
        if (c.orcamento_valor && c.orcamento_status === 'Aguardando aprovação') h += bt('orc:aprovar', 'Aprovar orçamento', 'ok') + bt('orc:reprovar', 'Reprovar orçamento', 'no');
      }
    }
  } else if (CONFIRMAVEIS.includes(c.status)) {
    h += bt('confirmar', c.status === 'Separado' ? '✓ Confirmar recebimento' : '✓ Já recebi', 'ok');
  }
  if (at) {
    h += bt('comentar', '💬 Comentar') + bt('foto', '📷 Adicionar foto');
    if (gestao() || ['Pendente','Visto'].includes(c.status)) h += bt('cancelar', 'Cancelar chamado', 'no');
  }
  return h;
}

// ---------- modal genérico
function abrirModal(tit, sub, campos, okTxt, onOk){
  $('#mdTit').textContent = tit; $('#mdSub').innerHTML = sub || '';
  const f = $('#mdForm');
  f.innerHTML = campos.map(c => {
    const req = c.req ? 'required' : '';
    if (c.tipo === 'info') return `<div class="inf">${c.html}</div>`;
    if (c.tipo === 'select') return `<label>${c.label}<select name="${c.k}" ${req}>${c.op.map(o => { const v = o.v != null ? o.v : o, t = o.t != null ? o.t : o; return `<option value="${esc(v)}" ${String(c.v) === String(v) ? 'selected' : ''}>${esc(t)}</option>`; }).join('')}</select></label>`;
    if (c.tipo === 'area') return `<label>${c.label}<textarea name="${c.k}" rows="3" ${req} placeholder="${esc(c.ph || '')}">${esc(c.v || '')}</textarea></label>`;
    if (c.tipo === 'lista') { const id = 'md' + (++_uid); return `<label>${c.label}<input id="${id}" name="${c.k}" value="${esc(c.v || '')}" ${req} placeholder="${esc(c.ph || '')}" autocomplete="off">${sugestoes(id, c.op || [])}</label>`; }
    if (c.tipo === 'fotos') return `<label class="fotoBtn">📷 Tirar ou escolher foto<input type="file" name="${c.k}" accept="image/*" multiple></label><div class="thumbs" data-prev="${c.k}"></div>`;
    return `<label>${c.label}<input name="${c.k}" type="${c.tipo || 'text'}" ${c.tipo === 'number' ? 'step="any" inputmode="decimal"' : ''} ${c.max ? `max="${c.max}"` : ''} value="${esc(c.v == null ? '' : c.v)}" ${req} placeholder="${esc(c.ph || '')}"></label>`;
  }).join('') + `<div class="bts"><button type="button" class="btn" data-fechar="modal">Voltar</button><button class="btn prim" type="submit">${okTxt}</button></div>`;
  const arq = {};
  f.querySelectorAll('input[type=file]').forEach(inp => inp.onchange = async () => {
    arq[inp.name] = (arq[inp.name] || []).concat(await lerFotos(inp.files, 3)).slice(0, 3); inp.value = '';
    f.querySelector(`[data-prev="${inp.name}"]`).innerHTML = arq[inp.name].map(x => `<div class="t"><img src="${x}"></div>`).join('');
  });
  $('#modal').style.display = 'flex';
  f.onsubmit = ev => { ev.preventDefault(); const v = {}; new FormData(f).forEach((val, k) => { if (typeof val === 'string') v[k] = val; }); Object.assign(v, arq); onOk(v); };
  const pri = f.querySelector('input:not([type=file]),select,textarea'); if (pri && window.innerWidth > 700) pri.focus();
}

// ---------- ações do detalhe
function acaoDetalhe(x){
  const c = S.d.chamados.find(y => y.id === S.detId); if (!c) return;
  const sub = `<b>${esc(c.id)}</b> · ${esc(c.unidade)} · ${esc(c.resumo)}`;
  const nomeCampo = {k:'nome', label:'Seu nome', tipo:'lista', op:S.d.usuario.nomes || [], v:S.nome, req:true};
  const comNome = arr => gestao() ? arr : [nomeCampo].concat(arr);
  const envia = (acao, extra) => v => { if (v.nome) lembrarNome(v.nome); executar(acao, Object.assign({id:c.id}, extra || {}, v)); };

  if (x === 'comentar') return abrirModal('Comentar', sub + '<br>O comentário fica no histórico e ' + (gestao() ? 'a filial vê.' : 'a gestão vê.'), comNome([{k:'texto', label:'Comentário', tipo:'area', req:true}]), 'Enviar', envia('comentar'));
  if (x === 'foto') return abrirModal('Adicionar foto', sub, comNome([{k:'fotos', tipo:'fotos'}, {k:'texto', label:'Legenda (opcional)'}]), 'Enviar foto', v => { if (!(v.fotos || []).length) return toast('Escolha uma foto.', true); envia('addFotos')(v); });
  if (x === 'cancelar') return abrirModal('Cancelar chamado', sub + '<br>O cancelamento fica registrado com data, hora e quem cancelou.', comNome([{k:'motivo', label:'Motivo do cancelamento', tipo:'area', req:true}]), 'Cancelar chamado', envia('cancelar'));
  if (x === 'confirmar') return abrirModal(c.tipo === 'Reparo' ? 'Confirmar serviço feito' : 'Confirmar recebimento', sub, [
    {k:'data_recebimento', label:'Data em que recebeu', tipo:'date', v:hojeISO(), max:hojeISO(), req:true},
    {k:'entregue_por', label:c.tipo === 'Reparo' ? 'Quem fez o serviço / entregou' : 'Quem entregou', tipo:'lista', op:c.entregador ? [c.entregador] : [], v:c.entregador || '', req:true},
    Object.assign({}, nomeCampo, {label:'Quem recebeu (você)'}),
    {k:'ok', label:'Chegou tudo certo?', tipo:'select', op:[{v:'sim', t:'Sim, tudo certo'}, {v:'nao', t:'Não — faltou algo, veio errado ou serviço incompleto'}], v:'sim'},
    {k:'obs', label:'Observação (obrigatória se teve problema)', tipo:'area'}
  ], 'Confirmar', envia('confirmarRecebimento'));

  const [tipo, alvo] = x.split(':');
  if (tipo === 'mv') {
    const campos = [];
    if (alvo === 'Aguardando orçamento') campos.push({k:'orcamento_valor', label:'Valor do orçamento (R$) — se já tiver', tipo:'number'}, {k:'orcamento_obs', label:'Fornecedor / detalhe do orçamento'});
    if (alvo === 'Separado') {
      const comItem = c.itens.filter(l => l.item_id !== '');
      if (comItem.length) {
        campos.push({tipo:'info', html:'<b>Baixa no estoque</b> — confira quanto está saindo do almoxarifado (deixe 0 se veio de compra direta).'});
        comItem.forEach(l => {
          const it = S.d.itens.find(i => i.id === String(l.item_id));
          const s = it ? num(it.estoque_atual) : 0, falta = Math.max(0, num(l.quantidade) - num(l.qtd_baixada));
          campos.push({k:'baixa_' + l.linha, label:`${l.item} — pedido ${N(l.quantidade)}, saldo ${it && String(it.estoque_atual) !== '' ? N(s) : 'sem contagem'}`, tipo:'number', v:Math.min(falta, s)});
        });
      }
      const livres = c.itens.filter(l => l.item_id === '');
      if (livres.length) campos.push({tipo:'info', html:'Itens livres (sem baixa automática): ' + livres.map(l => esc(l.item)).join(', ')});
      campos.push({k:'entregador', label:c.tipo === 'Reparo' ? 'Quem fez o serviço' : 'Quem vai levar / entregar', v:c.entregador || '', tipo:'lista', op:['Roberta','Charles','Carol']});
    }
    campos.push({k:'obs', label:'Observação para a filial (opcional)', tipo:'area', ph:alvo === 'Em compra' ? 'Ex.: previsão de chegada dia 20' : ''});
    return abrirModal(rotulo(alvo, c.tipo), sub, campos, 'Salvar', v => {
      const p = {id:c.id, status:alvo, obs:v.obs, entregador:v.entregador, orcamento_valor:v.orcamento_valor, orcamento_obs:v.orcamento_obs, baixas:{}};
      Object.keys(v).forEach(k => { if (k.startsWith('baixa_')) p.baixas[k.slice(6)] = v[k]; });
      executar('mover', p);
    });
  }
  if (tipo === 'orc') {
    if (alvo === 'informar') return abrirModal('Orçamento', sub, [{k:'valor', label:'Valor (R$)', tipo:'number', v:c.orcamento_valor, req:true}, {k:'obs', label:'Fornecedor / detalhe'}], 'Salvar orçamento', envia('orcamento', {acao_orc:'informar'}));
    if (alvo === 'aprovar') return abrirModal('Aprovar orçamento', sub + `<br>Valor: <b>${R(c.orcamento_valor)}</b>`, [{k:'proximo', label:'Próximo passo', tipo:'select', op:[{v:'Em compra', t:'Em compra'}, {v:'Em separação', t:c.tipo === 'Reparo' ? 'Em execução' : 'Em separação'}], v:'Em compra'}, {k:'obs', label:'Observação (opcional)', tipo:'area'}], 'Aprovar', envia('orcamento', {acao_orc:'aprovar'}));
    if (alvo === 'reprovar') return abrirModal('Reprovar orçamento', sub + `<br>Valor: <b>${R(c.orcamento_valor)}</b>. O chamado continua aguardando um novo orçamento.`, [{k:'obs', label:'Motivo', tipo:'area', req:true}], 'Reprovar', envia('orcamento', {acao_orc:'reprovar'}));
  }
}

    .filter(i => !b || semAcento(i.item + ' ' + i.id + ' ' + (i.sinonimos || '') + ' ' + (i.localizacao || '')).includes(b))
    .filter(i => !F.estBaixo || baixo(i))

    {k:'quantidade', label:'Quantidade que entrou', tipo:'number', req:true},

  ], 'Dar baixa', v => executar('saidaEstoque', Object.assign({item_id:i.id}, v)));

    {k:'obs', label:'Motivo', tipo:'area', req:true, ph:'Contagem física, perda, quebra, vencido…'}

      {k:'sinonimos', label:'Outros nomes para a busca (opcional)', v:novo ? '' : i.sinonimos, ph:'Ex.: para "Papel toalha": papel de mão, interfolha'},
      {k:'localizacao', label:'Onde fica no almoxarifado (opcional)', v:novo ? '' : i.localizacao, ph:'Ex.: prateleira 2, caixa azul'},
      {k:'estoque_minimo', label:'Estoque mínimo (alerta para repor)', tipo:'number', v:novo ? '' : i.estoque_minimo},
      {k:'custo_unitario', label:'Custo unitário (R$) — opcional', tipo:'number', v:novo ? '' : i.custo_unitario}
    ];
    if (novo) campos.push({k:'estoque_inicial', label:'Quantidade que já tem hoje', tipo:'number', v:0});
    else campos.push({k:'ativo', label:'Situação', tipo:'select', op:[{v:'sim', t:'Ativo'}, {v:'não', t:'Inativo (some da lista das filiais)'}], v:i.ativo === 'não' ? 'não' : 'sim'});
    abrirModal(novo ? 'Novo item' : 'Editar item', novo ? '' : 'O saldo só muda por Entrada, Saída ou Ajuste — tudo fica registrado.', campos, 'Salvar',
      v => executar('salvarItem', Object.assign(novo ? {} : {id:i.id}, v)));
  }
}

// ================= GESTÃO: MOVIMENTAÇÕES E REGISTRO =================
function viewMov(){
  const d = S.d, M = d.movimentos || [];
  const meses = [...new Set(M.map(m => mesDe(m.data)))].sort().reverse();
  const dest = [...new Set(M.map(m => m.unidade_destino).filter(Boolean))].sort();
  const lista = M.filter(m => !F.movMes || mesDe(m.data) === F.movMes).filter(m => !F.movDest || m.unidade_destino === F.movDest).filter(m => !F.movTipo || m.tipo === F.movTipo);
  return `<div class="filtros">
    <select id="mMes"><option value="">Todos os meses</option>${meses.map(m => `<option value="${m}" ${F.movMes === m ? 'selected' : ''}>${nomeMes(m)}</option>`).join('')}</select>
    <select id="mDest"><option value="">Todos os destinos</option>${dest.map(u => `<option ${F.movDest === u ? 'selected' : ''}>${esc(u)}</option>`).join('')}</select>
    <select id="mTipo"><option value="">Todos os tipos</option>${['Entrada','Saída','Ajuste'].map(t => `<option ${F.movTipo === t ? 'selected' : ''}>${t}</option>`).join('')}</select>
  </div>
  <div class="card" style="padding:8px"><div class="tw"><table><thead><tr><th>Data</th><th>Tipo</th><th>Item</th><th class="num">Qtd</th><th>Destino</th><th>Chamado</th><th>Responsável</th><th>Obs</th></tr></thead><tbody>
  ${lista.length ? lista.map(m => `<tr><td style="white-space:nowrap">${dataHora(m.data)}</td><td>${esc(m.tipo)}</td><td>${esc(m.item)}<div class="muted peq">${esc(m.departamento)}</div></td><td class="num">${N(m.quantidade)}</td><td>${esc(m.unidade_destino)}</td><td>${m.pedido_id ? `<a href="#" data-abrir="${esc(m.pedido_id)}">${esc(m.pedido_id)}</a>` : ''}</td><td>${esc(m.responsavel)}</td><td>${esc(m.obs)}</td></tr>`).join('') : '<tr><td colspan="8" class="vazio">Nenhuma movimentação.</td></tr>'}
  </tbody></table></div></div>`;
}

function viewLog(){
  const L = S.d.log || [], b = semAcento(F.logBusca);
  const lista = L.filter(l => !F.logUn || l.unidade === F.logUn).filter(l => !b || semAcento([l.quem, l.acao, l.chamado_id, l.detalhe].join(' ')).includes(b));
  return `<div class="inf" style="margin-bottom:12px">Registro de tudo o que foi feito no painel — quem, quando e o quê. Nenhuma ação apaga registros; cancelamentos ficam com data, hora e autor.</div>
  <div class="filtros">
    <select id="lUn"><option value="">Todos (gestão e filiais)</option>${S.d.unidades.map(u => `<option ${F.logUn === u ? 'selected' : ''}>${esc(u)}</option>`).join('')}</select>
    <input id="lBusca" placeholder="Buscar pessoa, ação, nº do chamado…" value="${esc(F.logBusca)}">
  </div>
  <div class="card" style="padding:8px"><div class="tw"><table><thead><tr><th>Quando</th><th>Quem</th><th>Ação</th><th>Chamado</th><th>Detalhe</th></tr></thead><tbody>
  ${lista.length ? lista.slice(0, 400).map(l => `<tr><td style="white-space:nowrap">${dataHora(l.data)}</td><td>${esc(l.quem)}</td><td>${esc(l.acao)}</td><td>${l.chamado_id ? `<a href="#" data-abrir="${esc(l.chamado_id)}">${esc(l.chamado_id)}</a>` : ''}</td><td>${esc(l.detalhe)}</td></tr>`).join('') : '<tr><td colspan="5" class="vazio">Nada registrado ainda.</td></tr>'}
  </tbody></table></div></div>`;
}

// ================= EVENTOS =================
document.addEventListener('click', ev => {
  const t = ev.target;
  const el = s => t.closest(s);
  let b;
  if ((b = el('[data-sug]'))) { ev.preventDefault(); const i = document.getElementById(b.dataset.sug); if (i) { i.value = b.dataset.v; i.dispatchEvent(new Event('input', {bubbles:true})); } return; }
  if ((b = el('[data-fechar]'))) { ev.preventDefault(); b.dataset.fechar === 'det' ? fecharDet() : fecharModal(); return; }
  if (t.id === 'det') { fecharDet(); return; }
  if (t.id === 'modal') { fecharModal(); return; }
  if ((b = el('[data-aba]'))) { S.aba = b.dataset.aba; render(); window.scrollTo(0,0); return; }
  if ((b = el('[data-x]'))) { acaoDetalhe(b.dataset.x); return; }
  if ((b = el('[data-abrir]'))) { ev.preventDefault(); abrirDetalhe(b.dataset.abrir); return; }
  if ((b = el('[data-ir]'))) { F.grupo = b.dataset.ir; S.aba = 'fila'; render(); return; }
  if ((b = el('[data-g]'))) { const ctx = b.closest('[data-ctx]').dataset.ctx; if (ctx === 'meus') F.meus = b.dataset.g; else F.grupo = b.dataset.g; render(); return; }
  if ((b = el('[data-e]'))) { acaoEstoque(b.dataset.e, b.dataset.id); return; }
  // novo pedido
  if ((b = el('[data-tipo]'))) { S.novo.tipo = b.dataset.tipo; render(); return; }
  if ((b = el('[data-add]'))) { adicionarItem(b.dataset.add); return; }
  if ((b = el('[data-cat]'))) { S.novo.cat = S.novo.cat === b.dataset.cat ? '' : b.dataset.cat; document.querySelectorAll('#nvCats [data-cat]').forEach(x => x.classList.toggle('on', x.dataset.cat === S.novo.cat)); renderBusca(); return; }
  if ((b = el('[data-livre]'))) { itemLivre(); return; }
  if ((b = el('[data-rm]'))) { S.novo.carrinho.splice(+b.dataset.rm, 1); renderCarrinho(); renderBusca(); return; }
  if ((b = el('[data-rmfoto]'))) { S.novo.fotos.splice(+b.dataset.rmfoto, 1); renderFotos(); return; }
});
document.addEventListener('change', ev => {
  const mapa = {fUn:'unidade', fPrio:'prio', eCat:'estCat', mMes:'movMes', mDest:'movDest', mTipo:'movTipo', lUn:'logUn'};
  if (mapa[ev.target.id]) { F[mapa[ev.target.id]] = ev.target.value; render(); }
  if (ev.target.id === 'eBaixo') { F.estBaixo = ev.target.checked; render(); }
});
document.addEventListener('input', ev => {
  const mapa = {fBusca:'busca', eBusca:'estBusca', lBusca:'logBusca'};
  const id = ev.target.id;
  if (mapa[id]) { F[mapa[id]] = ev.target.value; clearTimeout(window._bt); window._bt = setTimeout(() => { render(); const e = document.getElementById(id); if (e) { e.focus(); e.setSelectionRange(e.value.length, e.value.length); } }, 300); }
});
document.addEventListener('keydown', ev => { if (ev.key === 'Escape') { if ($('#modal').style.display === 'flex') fecharModal(); else if ($('#det').style.display === 'flex') fecharDet(); } });

iniciar();
</script>
</body>
